    (hc.length?'<div class="card"><h2>내 건강에 맞춘 주의사항</h2><p class="sub small">건강 체크와 건강 기록을 바탕으로 보여 드려요.</p><ul class="caution">'+hc.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><a class="btn secondary" href="#check">건강 기록 확인하기</a></div>':'')+
    '<div class="card"><h2>내 정보</h2><p class="mt" style="white-space:pre-line">'+esc(profileSummary())+'</p><p class="small sub mt">입력한 정보는 운동 처방을 맞추는 데에만 쓰이고, 다른 목적으로 쓰지 않아요.</p><button class="btn secondary" id="pfedit">'+(S.profile?'내 정보 고치기':'내 정보 입력하기')+'</button></div>'+
    extCard()+
    '<div class="card"><h2>평소 운동 습관</h2><p class="mt">'+esc(habitSummary())+'</p><button class="btn secondary" id="hedit">'+(S.habit?'고치기':'입력하기')+'</button></div>'+
    '<div class="card"><h2>운동 도구와 난이도</h2><p class="sub small">가지고 있는 도구에 맞춰 운동을 처방하고, 익숙해지면 난이도를 올려요.</p>'+
      '<fieldset class="q mt2"><legend>가지고 있는 도구</legend>'+pick('setequip',EQUIP_UI,equipSel(),2,'multi')+'</fieldset>'+
      '<h3 class="mt">동작별 난이도</h3><div class="hist mt">'+Object.keys(PAT_NAME).map(p=>{ const lv=(S.levels||{})[p]||1; return '<div><span><b>'+PAT_NAME[p]+' '+lv+'단계</b><br><span class="sub small">'+esc(LADDER[p])+'</span></span><span style="display:flex;gap:6px;align-items:center"><button class="textbtn" data-lv="'+p+'" data-d="-1" aria-label="'+PAT_NAME[p]+' 난이도 내리기"'+(lv<=1?' disabled':'')+'>−</button><button class="textbtn" data-lv="'+p+'" data-d="1" aria-label="'+PAT_NAME[p]+' 난이도 올리기"'+(lv>=3?' disabled':'')+'>+</button></span></div>'; }).join('')+'</div>'+
      '<p class="small sub mt">운동 뒤 ‘얼마나 힘들었나요’에서 ‘쉬움’ 이하를 두 번 연속 고르면 한 단계 올리고, ‘힘듦’을 고르면 한 단계 내려요. 1~2주차, 그리고 건강 기록 때문에 가벼운 강도로만 처방할 때는 1단계로 맞춰요. 골다공증이 있거나 65세 이상이면 바닥에서 하는 동작은 빼요.</p></div>'+
    '<div class="card"><h2>기록 관리</h2><p class="sub small">지울 기록을 골라 주세요. 지운 기록은 되돌릴 수 없어요.</p><div class="mt">'+
      [['logs','운동 기록','처방, 운동 전후 기분, 운동 시간'],['tests','검사 기록','마음 검사, 갱년기 증상 검사'],['health','건강 체크와 건강 기록','질환, 약, 혈압, 의사 소견'],['profile','내 정보','나이, 폐경 시기, 몸무게, 평소 운동 습관'],['ext','건강 앱에서 가져온 기록','걸음 수, 수면 시간']].map(x=>'<label class="hrow"><input type="checkbox" name="delpick" value="'+x[0]+'"><span><b>'+x[1]+'</b><span class="sub small">'+x[2]+'</span></span></label>').join('')+
    '</div><p class="err" id="delerr" style="text-align:left"></p><button class="btn secondary" id="delsel">고른 기록 지우기</button>'+
    '<div style="border-top:1px solid var(--line); margin-top:22px; padding-top:18px"><h3>처음부터 다시 시작</h3><p class="sub small">모든 기록과 내 정보를 지우고 첫 화면부터 다시 시작해요. 음성 설정은 그대로 남아요.</p><button class="btn" id="delall" style="background:var(--t-care);color:#fff">모든 기록 지우고 처음부터 시작</button></div></div>'+
    '<p class="small sub" style="text-align:center">두 번째 봄은 운동 습관을 돕는 서비스로, 의료 진단이나 치료를 대신하지 않습니다.</p>';
  bindExt(box);
  bindEquip(box,'setequip',()=>{ S.equip=readEquip(box,'setequip'); save(); });
  box.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; S.levels=S.levels||{}; const p=b.dataset.lv; S.levels[p]=Math.max(1,Math.min(3,(S.levels[p]||1)+Number(b.dataset.d))); save(); renderSettings(); });
  box.querySelector('#hedit').onclick=()=>{ ui.setForm='habit'; renderSettings(); scrollTop(); };
  box.querySelector('#pfedit').onclick=()=>{ ui.setForm='profile'; renderSettings(); scrollTop(); };
  const ds=box.querySelector('#delsel');
  ds.onclick=()=>{
    const sel=[...box.querySelectorAll('input[name=delpick]:checked')].map(e=>e.value);
    if(!sel.length){ box.querySelector('#delerr').textContent='지울 기록을 먼저 골라 주세요.'; return; }
    if(!ds.dataset.ok){ ds.dataset.ok='1'; ds.textContent='정말 지울까요? 한 번 더 누르면 지워져요'; ds.style.background='var(--t-care)'; ds.style.color='#fff'; return; }
    if(sel.includes('logs')) S.logs=[];
    if(sel.includes('tests')){ S.phq=[]; S.mrs=[]; S.careDay=null; S.mrsLater=false; }
    if(sel.includes('health')){ S.health=null; S.parq=null; }
    if(sel.includes('profile')){ S.profile=null; S.profileLater=false; S.habit=null; S.habitLater=false; }
    if(sel.includes('ext')) S.ext=null;
    save(); ui.step='form'; ui.result=null; ui.rx=null;
    box.querySelector('#delerr').textContent='';
    renderSettings(); const m=document.createElement('p'); m.className='note'; m.setAttribute('role','status'); m.textContent='고른 기록을 지웠어요.'; box.querySelector('#delsel').after(m);
  };
  const da=box.querySelector('#delall');
  da.onclick=()=>{
    if(!da.dataset.ok){ da.dataset.ok='1'; da.textContent='정말 모두 지울까요? 한 번 더 누르면 지워져요'; return; }
    const keep=S.settings; S=blank(); S.settings=keep; save(); ui={step:'form'}; location.hash='#today'; render(); scrollTop();
  };
  const upd=(k,v)=>{ S.settings=Object.assign(SET(),{[k]:v}); save(); };
  box.querySelectorAll('input[name=setvon]').forEach(r=>r.onchange=()=>upd('voiceOn',r.value==='on'));
  box.querySelectorAll('input[name=setengine]').forEach(r=>r.onchange=()=>{ upd('engine',r.value); useLocal=false; renderSettings(); say('이 목소리로 안내해 드릴게요. 들이마시세요. 내쉬세요.',true); });
  box.querySelectorAll('input[name=setvoice]').forEach(r=>r.onchange=()=>{ upd('voice',r.value); useLocal=false; say('이 목소리로 안내해 드릴게요.',true); });
  box.querySelectorAll('input[name=setlocal]').forEach(r=>r.onchange=()=>{ upd('localVoice',r.value); say('이 목소리로 안내해 드릴게요.',true); });
  box.querySelectorAll('input[name=setrate]').forEach(r=>r.onchange=()=>upd('rate',Number(r.value)));
  box.querySelectorAll('input[name=setspeed]').forEach(r=>r.onchange=()=>upd('speed',Number(r.value)));
  box.querySelectorAll('input[name=setmon]').forEach(r=>r.onchange=()=>{ upd('musicOn',r.value==='on'); if(r.value==='off') musicStop(); });
  box.querySelectorAll('input[name=setmvol]').forEach(r=>r.onchange=()=>{ upd('musicVol',r.value); if(M.on) setGain(musicVol(),.3); });
  const mp=box.querySelector('#mprev');
  if(mp) mp.onclick=()=>{ if(M.on && !ui.sess){ musicStop(); mp.textContent='음악 들어 보기'; return; } if(ui.sess) return; const was=SET().musicOn; if(!was) S.settings=Object.assign(SET(),{musicOn:true}); musicPlay('gymno'); if(!was) S.settings=Object.assign(SET(),{musicOn:false}); mp.textContent='멈추기'; clearTimeout(M.prevT); M.prevT=setTimeout(()=>{ if(!ui.sess){ musicStop(); if(mp.isConnected) mp.textContent='음악 들어 보기'; } },15000); };
  const pv=box.querySelector('#preview'); if(pv) pv.onclick=()=>{ useLocal=false; say('안녕하세요, 두 번째 봄이에요. 천천히 들이마시세요. 이제 길게 내쉬세요.',true); };
}

/* =========================================================
   12. 화면 전환
   ========================================================= */
const VIEWS=['today','check','change','learn','settings'];
const view=()=>{ const h=location.hash.slice(1); return VIEWS.includes(h)?h:'today'; };
function render(){
  const v=view();
  VIEWS.forEach(n=>document.getElementById('v-'+n).classList.toggle('on',n===v));
  document.querySelectorAll('nav.tabs a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  topWeek();
  if(v==='today') renderToday();
  if(v==='check') renderCheck();
  if(v==='change') renderChange();
  if(v==='learn') renderLearn();
  if(v==='settings') renderSettings();
  if(v!=='settings' && !ui.sess && M.on) musicStop();
  const gr=document.querySelector('.gear'); if(gr){ if(v==='settings') gr.setAttribute('aria-current','page'); else gr.removeAttribute('aria-current'); }
}
window.addEventListener('hashchange',()=>{ ui.sheet=null; render(); scrollTop(); });
document.querySelectorAll('nav.tabs a').forEach(a=>a.addEventListener('click',()=>{ ui.checkForm=null; ui.setForm=null; if(view()===a.dataset.v){ render(); scrollTop(); } }));

function showErr(e){
  let el=document.getElementById('apperr');
  if(!el){ el=document.createElement('div'); el.id='apperr'; el.setAttribute('role','alert'); el.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--card);color:var(--t-care);border:2px solid var(--t-care);border-radius:14px;padding:12px 14px;font-size:.85rem;font-weight:600'; document.body.appendChild(el); }
  el.textContent='문제가 생겼어요. 이 화면을 캡처해서 알려 주세요: '+((e&&e.message)||e);
}
window.addEventListener('error',ev=>showErr(ev.error||ev.message));
window.addEventListener('unhandledrejection',ev=>showErr(ev.reason));
document.querySelector('.gear').addEventListener('click',()=>{ ui.setForm=null; if(view()==='settings'){ renderSettings(); scrollTop(); } });
loadLocal(); render(); initRemote(); initDl(); initSample(); initTts();
(function(){
  const sp=document.getElementById('splash'); if(!sp) return;
  let gone=false;
  const close=()=>{ if(gone) return; gone=true; sp.classList.add('out'); setTimeout(()=>{ sp.remove(); },800); };
  document.getElementById('sgo').onclick=close;
  sp.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  setTimeout(()=>{ try{ document.getElementById('sgo').focus({preventScroll:true}); }catch(e){} },1800);
  setTimeout(close,4500);
})();
})();
</script>
