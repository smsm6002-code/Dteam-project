<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 번째 봄v.14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --line:#d2d2d7; --fill:#e8e8ed;
  --action:#a9c8ec; --on-action:#14345c; --accent:#2f6fb5; --action-soft:#e4eefa; --link:#2f6fb5;
  --good:#1d7d36; --warn:#b84a00; --alert-bg:#fff4e5; --alert-line:#f5c88a;
  --t-recover:#6b5bd2; --t-ease:#c2410c; --t-calm:#0e7c86; --t-active:#1d7d36; --t-care:#b42318;
  --bar-bg:rgba(245,245,247,.82); --fig:#3a4a5c; --prop:#b9c3cf;
  --spring:linear-gradient(100deg,#e2557f 0%,#f08a4b 45%,#3aa45c 100%);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --line:#3a3a3c; --fill:#2c2c2e;
    --action:#8fb4e3; --on-action:#0b2140; --accent:#9cc3ff; --action-soft:#1f3047; --link:#9cc3ff;
    --good:#30d158; --warn:#ff9f0a; --alert-bg:#2b1d0b; --alert-line:#6b4a1a;
    --t-recover:#a99bff; --t-ease:#ff9f0a; --t-calm:#40c8d6; --t-active:#30d158; --t-care:#ff6961;
    --bar-bg:rgba(22,22,23,.82); --fig:#d7dde5; --prop:#4a5260;
    --spring:linear-gradient(100deg,#ff7aa2 0%,#ffab6b 45%,#5fd27f 100%);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --line:#3a3a3c; --fill:#2c2c2e;
  --action:#8fb4e3; --on-action:#0b2140; --accent:#9cc3ff; --action-soft:#1f3047; --link:#9cc3ff;
  --good:#30d158; --warn:#ff9f0a; --alert-bg:#2b1d0b; --alert-line:#6b4a1a;
  --t-recover:#a99bff; --t-ease:#ff9f0a; --t-calm:#40c8d6; --t-active:#30d158; --t-care:#ff6961;
  --bar-bg:rgba(22,22,23,.82); --fig:#d7dde5; --prop:#4a5260;
  --spring:linear-gradient(100deg,#ff7aa2 0%,#ffab6b 45%,#5fd27f 100%);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:20px; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Gowun Dodum",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:1.05rem; line-height:1.6; word-break:keep-all; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; padding-bottom:110px;
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bar-bg); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px)}
h1,h2,h3,p{margin:0}
h1{font-size:2.2rem; line-height:1.12; font-weight:700; letter-spacing:-.03em}
h2{font-size:1.45rem; line-height:1.2; font-weight:700; letter-spacing:-.025em}
h3{font-size:1.1rem; line-height:1.3; font-weight:700; letter-spacing:-.02em}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:8px}
a{color:var(--link)}
.wrap{max-width:640px; margin:0 auto; padding:0 20px}
.sub{color:var(--ink2)}
.small{font-size:.9rem}
.mt{margin-top:12px} .mt2{margin-top:24px}

/* 상단 막대 */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--bar-bg); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line)}
.topbar .in{max-width:640px; margin:0 auto; padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between}
.brand{font-family:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif; font-weight:700; font-size:1.1rem; letter-spacing:.05em; background:var(--haze); -webkit-background-clip:text; background-clip:text; color:transparent}
.wk{font-size:.85rem; color:var(--ink2); font-weight:500}
.topr{display:flex; align-items:center; gap:6px}
.gear{display:grid; place-items:center; width:44px; height:44px; margin-right:-10px; color:var(--ink); border-radius:12px}
.gear svg{width:24px; height:24px}
.gear[aria-current="page"]{color:var(--accent)}
.caution{list-style:none; padding:0; margin:10px 0 0}
.caution li{padding:10px 0; border-top:1px solid var(--line); font-size:.97rem}
.caution li:first-child{border-top:none}
.caution.stop li{color:var(--t-care); font-weight:600}

/* 큰 제목 */
.page-head{padding:30px 0 18px}
.page-head .date{color:var(--ink2); font-weight:500; margin-bottom:4px}
.weeks{display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:16px}
.weeks i{height:6px; border-radius:3px; background:var(--fill)}
.weeks i.done{background:var(--ink2)}
.weeks i.now{background:var(--action)}

/* 카드 */
.card{background:var(--card); border-radius:22px; padding:24px 22px; margin:0 0 14px}
.card.plain{background:transparent; padding:6px 2px}
.card h2+p,.card h3+p{margin-top:6px}

/* 버튼 */
.btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:58px; border:none; border-radius:980px; background:var(--action); color:var(--on-action); font-weight:600; font-size:1.05rem; cursor:pointer; padding:12px 24px; text-decoration:none; margin-top:18px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.advice{text-align:left; margin-top:18px; border-top:1px solid var(--line); padding-top:16px}
.advice p{margin-top:8px}
.helps{list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px}
.helps li{background:var(--fill); border-radius:14px; padding:12px 14px; font-size:.95rem}
.helps li b{display:block}
.helps a{font-weight:700}
.tips{margin:10px 0 0; padding-left:1.1em} .tips li{margin:6px 0; font-size:.95rem}
.hrow{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); cursor:pointer}
.hrow:first-child{border-top:none}
.hrow input[type=checkbox]{width:26px; height:26px; flex:none; margin-top:2px; accent-color:var(--accent)}
.hrow b{display:block}
.hrow .ev{display:block; font-size:.85rem; color:var(--accent); margin-top:2px}
.hrow.found{background:var(--action-soft); border-radius:12px; padding:12px; border-top:none; margin:4px 0}
.bp{display:flex; align-items:center; gap:8px; margin-top:8px; color:var(--ink2)}
.bp input,.htext{min-height:52px; border:none; border-radius:12px; background:var(--fill); font-size:1.05rem; color:var(--ink); padding:8px 12px}
.bp input{width:96px; text-align:center; font-weight:700}
.htext{width:100%; min-height:90px; resize:vertical; margin-top:8px}
.filebox{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:130px; border:2px dashed var(--line); border-radius:18px; text-align:center; padding:16px; cursor:pointer; color:var(--ink2); margin-top:14px}
.filebox b{color:var(--ink); font-size:1.05rem}
.filebox input{position:absolute; opacity:0; width:1px; height:1px}
.filebox:focus-within{outline:3px solid var(--accent); outline-offset:3px}
.thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.thumbs img{width:72px; height:96px; object-fit:cover; border-radius:10px; border:1px solid var(--line)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.tags span{background:var(--fill); border-radius:980px; padding:6px 12px; font-size:.9rem}
.spin{width:34px; height:34px; border-radius:50%; border:4px solid var(--fill); border-top-color:var(--accent); margin:6px auto 14px; animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.hadj{margin-top:14px; border-radius:16px; background:var(--action-soft); padding:14px}
.hadj h3{font-size:.95rem}
.hadj ul{margin:6px 0 0; padding-left:1.1em} .hadj li{margin:5px 0; font-size:.92rem}
.sess{background:var(--card); border-radius:28px; padding:22px 20px 24px; margin:0 0 14px; text-align:center}
.sess .step{color:var(--ink2); font-size:.9rem; font-weight:500}
.sess .srow{display:flex; justify-content:space-between; align-items:center; margin:-6px -4px 0}
.sess .srow .textbtn{font-weight:600; font-size:1rem}
.plan li.done .n,.plan li.done .h{opacity:.55}
.plan li.cur{background:var(--action-soft); border-radius:14px; padding:14px 10px; border-top:none}
.lvtag{display:inline-block; font-size:.72rem; font-weight:700; color:var(--on-action); background:var(--action); border-radius:980px; padding:1px 8px; vertical-align:2px}
.plan .jump{grid-column:2 / -1; justify-self:start; padding:4px 0; font-size:.9rem}
.sess .bar{height:6px; background:var(--fill); border-radius:3px; overflow:hidden; margin:8px 0 14px}
.sess .bar i{display:block; height:100%; background:var(--action)}
.sess .stage{width:100%; max-width:320px; aspect-ratio:192/184; margin:0 auto; background:var(--fill); border-radius:22px; overflow:hidden}
.sess .stage svg{width:100%; height:100%; display:block}
.sess .name{font-size:1.5rem; font-weight:700; letter-spacing:-.03em; margin-top:14px}
.sess .clock{font-size:3.4rem; font-weight:700; letter-spacing:-.03em; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.sess .cue{font-size:1.35rem; font-weight:700; color:var(--accent); min-height:1.6em; margin-top:6px}
.sess .how{color:var(--ink2); font-size:.95rem; margin-top:8px; text-align:left}
.sess .ctrl{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.sess .ctrl .btn{margin-top:0}
.toggles{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.speed{display:flex; align-items:center; gap:6px; margin-top:14px; background:var(--fill); border-radius:14px; padding:6px}
.speed span{font-size:.9rem; font-weight:600; color:var(--ink2); padding:0 6px 0 8px}
.speed button{flex:1; min-height:46px; border:none; border-radius:10px; background:transparent; font-weight:600; font-size:.98rem; color:var(--ink); cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.voice{display:inline-flex; align-items:center; gap:8px; margin-top:14px; background:var(--fill); border:none; border-radius:980px; padding:10px 16px; font-weight:600; cursor:pointer; color:var(--ink)}
.voice[aria-pressed="false"]{opacity:.6}
.btn.secondary{background:var(--fill); color:var(--ink)}
.btn:active{opacity:.85}
.textbtn{background:none; border:none; color:var(--link); cursor:pointer; padding:10px 4px; font-size:.95rem; font-weight:500}
.textbtn[data-lv]{width:44px; height:44px; padding:0; border-radius:12px; background:var(--fill); color:var(--ink); font-size:1.3rem; font-weight:700}
.textbtn[data-lv]:disabled{opacity:.35}
.textbtn.center{display:block; margin:6px auto 0}

/* 환영 화면 */
.hero{text-align:center; padding:56px 0 30px}
.hero .name{white-space:nowrap; font-family:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif; font-weight:700; font-size:clamp(2.1rem, 12vw, 3.4rem); line-height:1.25; letter-spacing:.04em; background:var(--haze); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 14px var(--haze-glow)); animation:haze 2.4s ease-out both}
@keyframes haze{from{opacity:0; filter:blur(10px) drop-shadow(0 0 14px var(--haze-glow)); letter-spacing:.14em} to{opacity:1; filter:blur(0) drop-shadow(0 0 14px var(--haze-glow)); letter-spacing:.06em}}
:root{--haze:linear-gradient(100deg,#dbaabb 0%,#c2aed8 55%,#a9c8b9 100%); --haze-glow:rgba(226,186,203,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--haze:linear-gradient(100deg,#f2c4d3 0%,#d4c3ee 55%,#bfe0cf 100%); --haze-glow:rgba(242,196,211,.35)}}
:root[data-theme="dark"]{--haze:linear-gradient(100deg,#f2c4d3 0%,#d4c3ee 55%,#bfe0cf 100%); --haze-glow:rgba(242,196,211,.35)}
@media (prefers-reduced-motion:reduce){.hero .name{animation:none}}
.hero .lead{font-size:1.35rem; font-weight:600; margin-top:14px; letter-spacing:-.02em}
.hero .sub{margin-top:10px}
.feat{display:grid; gap:2px; border-radius:22px; overflow:hidden; margin:8px 0 14px}
.feat div{background:var(--card); padding:18px 22px}
.feat b{display:block; font-size:1.05rem}
.feat span{color:var(--ink2); font-size:.95rem}

/* 선택 칩 */
fieldset{border:none; margin:0; padding:0; min-width:0}
.q{margin:0 0 22px}
.q legend{font-weight:700; font-size:1.05rem; margin-bottom:10px; padding:0}
.q legend small{display:block; font-weight:400; color:var(--ink2); font-size:.85rem}
.pick{display:grid; gap:6px}
.pick.c5{grid-template-columns:repeat(5,1fr)}
.pick.c4{grid-template-columns:repeat(4,1fr)}
.pick.c3{grid-template-columns:repeat(3,1fr)}
.pick.c2{grid-template-columns:repeat(2,1fr)}
.pick.c1{grid-template-columns:1fr}
.pick.c1 span{flex-direction:row; justify-content:space-between; text-align:left; padding:10px 16px; min-height:56px}
.pick.c1 span i{font-size:.82rem; opacity:.8}
.row-in{display:flex; gap:12px; flex-wrap:wrap; margin-top:8px}
.row-in .custom{margin-top:0}
.howto{margin:8px 0 14px; font-size:.92rem; color:var(--ink2)}
.howto summary{cursor:pointer; color:var(--link); font-weight:500; padding:4px 0}
.howto ol{margin:6px 0 0; padding-left:1.2em} .howto li{margin:4px 0}
.ym{display:grid; grid-template-columns:1fr 1.4fr; gap:8px; margin-top:8px}
.ym select{min-height:54px; border:none; border-radius:12px; background:var(--fill); padding:0 12px; font-size:1rem; color:var(--ink)}
.pick label{cursor:pointer; display:block}
.pick input{position:absolute; opacity:0; pointer-events:none}
.pick span{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:60px; border-radius:14px; background:var(--fill); text-align:center; padding:8px 4px; line-height:1.2; font-weight:500; font-size:.95rem; border:2px solid transparent}
.pick.c5 span{min-height:82px}
.pick span b{font-size:1.45rem; font-weight:700}
.pick span i{font-style:normal; font-size:.8rem; font-weight:500}
.pick input:checked + span{background:var(--action); color:var(--on-action)}
.pick input:focus-visible + span{outline:3px solid var(--accent); outline-offset:3px}
.pick.multi input:checked + span{background:var(--action-soft); color:var(--on-action); border-color:var(--action)}
.custom{display:flex; align-items:center; gap:10px; margin-top:10px; color:var(--ink2)}
.custom input{width:110px; min-height:56px; border:none; border-radius:14px; background:var(--fill); text-align:center; font-size:1.15rem; font-weight:700; color:var(--ink)}
.err{color:var(--warn); font-size:.9rem; margin-top:6px; min-height:1px}

/* 문항형 검사 */
.item{padding:18px 0; border-top:1px solid var(--line)}
.item:first-of-type{border-top:none; padding-top:4px}
.item legend{font-weight:600; margin-bottom:10px; padding:0; display:flex; gap:10px}
.item legend em{font-style:normal; color:var(--ink2); font-weight:500; flex:none; min-width:1.4em}
.item legend small{display:block; color:var(--ink2); font-weight:400; font-size:.85rem}
.item.missing{background:transparent; border:3px solid var(--t-care); border-radius:16px; padding:14px 12px; margin:6px -6px}
.item.missing legend > span::after{content:"이 문항의 답을 골라 주세요"; display:block; color:var(--t-care); font-size:.85rem; font-weight:700; margin-top:4px}
.err{font-weight:600; text-align:center}
#qerr:not(:empty){border:3px solid var(--t-care); border-radius:14px; padding:12px 14px; margin-top:14px; color:var(--t-care); background:var(--card); font-size:.98rem; font-weight:700}
.progress{height:4px; background:var(--fill); border-radius:2px; margin:14px 0 4px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--action); width:0; transition:width .2s}

/* 처방 */
.rx{border-radius:28px; background:var(--card); padding:30px 24px 24px; margin:0 0 14px}
.rx .kind{font-weight:700; font-size:.95rem}
.rx h2{font-size:2rem; line-height:1.15; letter-spacing:-.035em; margin-top:6px}
.rx .why{margin-top:12px; color:var(--ink2)}
.specs{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-radius:16px; overflow:hidden; margin:22px 0}
.specs div{background:var(--card); padding:14px 14px}
.specs dt{font-size:.8rem; color:var(--ink2); font-weight:500}
.specs dd{margin:2px 0 0; font-weight:600; font-size:.98rem; line-height:1.35}
.specs dl{margin:0}
.plan{list-style:none; padding:0; margin:0}
.plan li{display:grid; grid-template-columns:64px 1fr auto; gap:2px 12px; padding:14px 0; border-top:1px solid var(--line); align-items:center}
.plan .fig{grid-row:1 / span 2; width:64px; height:68px; background:var(--fill); border-radius:12px; overflow:hidden}
.plan .fig svg{width:100%; height:100%; display:block}
.plan li:first-child{border-top:none}
.plan .n{font-weight:700}
.plan .m{font-weight:700; color:var(--accent); text-align:right}
.plan .h{grid-column:2 / -1; color:var(--ink2); font-size:.92rem}
.metime{margin-top:10px; font-weight:600; color:var(--accent); font-size:.97rem}
.mustbox{display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--alert-bg); border:1.5px solid var(--alert-line); border-radius:16px; padding:12px 14px; margin-top:14px; cursor:pointer; font-size:.93rem; line-height:1.45; color:var(--ink)}
.mustbox .mi{flex:none; width:26px; height:26px; border-radius:50%; background:var(--warn); color:#fff; display:grid; place-items:center; font-weight:800}
.mustbox .more{margin-left:auto; font-size:1.4rem; color:var(--ink2)}
.tipcard{margin-top:18px; background:var(--fill); border-radius:16px; padding:12px 14px}
.tiplabel{font-size:.78rem; font-weight:700; color:var(--accent); letter-spacing:.02em}
.tiptext{font-size:.93rem; margin-top:4px; line-height:1.5}
.tipbar{display:flex; justify-content:space-between; margin-top:2px}
.tipbar .textbtn{font-size:.88rem; padding:6px 0}
.minor{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 16px; margin-top:12px}
.minor{gap:2px 18px}
.minor .textbtn{font-size:1.02rem; font-weight:500; color:var(--ink2); text-decoration:none; padding:12px 4px}
.sheetwrap{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--card); width:100%; max-width:640px; max-height:82vh; overflow-y:auto; border-radius:24px 24px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px)); outline:none; animation:sheetup .25s ease-out}
@keyframes sheetup{from{transform:translateY(40px); opacity:.6} to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px}
.shhead{display:flex; justify-content:space-between; align-items:center}
.shsec{margin-top:18px} .shsec h3{font-size:.95rem; color:var(--ink2)} .shsec p{margin-top:6px; font-size:.95rem}
.shlist{margin:8px 0 0; padding-left:1.1em} .shlist li{margin:6px 0; font-size:.95rem}
.shlist.must li{color:var(--ink); font-weight:600}
.shbrain{background:var(--fill); border-radius:14px; padding:12px 14px; margin-top:8px} .shbrain p{font-size:.92rem}
.note{background:var(--fill); border-radius:14px; padding:12px 14px; font-size:.92rem; margin-top:10px}
.brain{border-radius:22px; background:var(--card); padding:22px; margin:0 0 14px}
.brain h3{font-size:1rem}
.brain p{margin-top:6px; font-size:.97rem}
.brain .src{color:var(--ink2); font-size:.82rem; margin-top:8px}

.alert{background:var(--alert-bg); border:1px solid var(--alert-line); border-radius:18px; padding:16px 18px; margin:0 0 14px; font-size:.97rem}
.alert b{display:block; margin-bottom:2px}
.care{border-radius:28px; background:var(--card); padding:30px 24px; margin:0 0 14px; border:2px solid var(--t-care)}
.care h2{color:var(--t-care)}
.care .lines{margin-top:16px; display:grid; gap:10px}
.care .lines a{display:flex; justify-content:space-between; align-items:center; background:var(--fill); border-radius:14px; padding:14px 16px; text-decoration:none; color:var(--ink); font-weight:600}
.care .lines a span{color:var(--ink2); font-weight:400; font-size:.88rem}
.care .lines a b{font-size:1.3rem; color:var(--accent)}

.done-card{text-align:center; padding:34px 24px}
.done-card .big{font-size:1.6rem; font-weight:700; letter-spacing:-.03em; line-height:1.25}
.chg{display:flex; justify-content:center; gap:22px; margin-top:14px; flex-wrap:wrap}
.chg div{text-align:center}
.chg b{display:block; font-size:1.6rem}
.chg span{font-size:.85rem; color:var(--ink2)}
.up{color:var(--good)} .down{color:var(--warn)}

/* 변화 */
.compare{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center; margin-top:14px}
.compare b{display:block; font-size:2.2rem; line-height:1; letter-spacing:-.03em}
.compare span{font-size:.82rem; color:var(--ink2)}
.compare .arrow{color:var(--ink2); font-size:1.4rem}
.verdict{margin-top:12px; text-align:center; font-weight:600}
.subs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.subs div{background:var(--fill); border-radius:12px; padding:10px; text-align:center}
.subs b{display:block; font-size:1.05rem}
.subs span{font-size:.78rem; color:var(--ink2)}
.chart{overflow-x:auto; margin-top:12px}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.85rem; color:var(--ink2); margin-top:8px}
.legend span::before{content:""; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c)}
.typebars{display:grid; gap:12px; margin-top:12px}
.typebars .row{display:grid; grid-template-columns:5.5em 1fr 3.4em; align-items:center; gap:10px; font-size:.92rem}
.typebars .track{height:12px; background:var(--fill); border-radius:6px; overflow:hidden}
.typebars .track i{display:block; height:100%; border-radius:6px}
.typebars .v{text-align:right; font-weight:700}
.log{padding:14px 0; border-top:1px solid var(--line)}
.log:first-child{border-top:none}
.log .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.log .t{font-weight:700}
.log .d{color:var(--ink2); font-size:.85rem}
.log .x{font-size:.9rem; color:var(--ink2); margin-top:2px}
.dots{display:flex; gap:8px; margin-top:12px}
.dots i{width:28px; height:28px; border-radius:50%; background:var(--fill)}
.dots i.on{background:var(--action)}
.hist{display:grid; gap:0}
.hist div{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:.95rem}
.hist div:first-child{border-top:none}

/* 알아보기 */
.rules{width:100%; border-collapse:collapse; font-size:.92rem}
.rules th,.rules td{text-align:left; vertical-align:top; padding:10px 6px; border-top:1px solid var(--line)}
.rules th{font-weight:600; color:var(--ink2); font-size:.82rem; border-top:none}
.scroll{overflow-x:auto}
.ref{font-size:.85rem; color:var(--ink2); margin-top:6px}
.dot-k{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:1px}

/* 하단 탭 */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:9; background:var(--bar-bg); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:66px; text-decoration:none; color:var(--ink2); font-size:.8rem; font-weight:500}
nav.tabs svg{width:26px; height:26px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.view{display:none} .view.on{display:block}
.foot{font-size:.8rem; color:var(--ink2); text-align:center; margin:26px 0 0; line-height:1.5}
@media (max-width:380px){ .pick.c5 span i{font-size:.72rem} h1{font-size:1.9rem} .hero .name{font-size:clamp(2.1rem, 12vw, 3.4rem)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#splash{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 24px calc(12vh + 24px); background:var(--page); transition:opacity .7s ease, visibility .7s}
#splash.out{opacity:0; visibility:hidden}
#splash .glow{position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, var(--haze-glow) 0%, transparent 70%); filter:blur(10px); animation:breathe 4s ease-in-out infinite}
#splash .in{position:relative}
#splash .sname{white-space:nowrap; font-family:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif; font-weight:700; font-size:clamp(2.3rem, 13.5vw, 3.6rem); line-height:1.25; letter-spacing:.04em; background:var(--haze); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 14px var(--haze-glow)); animation:haze 2.4s ease-out both}
#splash .slead{font-size:1.1rem; font-weight:500; margin-top:22px; opacity:0; animation:rise .9s ease-out 1s forwards}
#splash .ssub{color:var(--ink2); margin-top:6px; opacity:0; animation:rise .9s ease-out 1.3s forwards}
#splash .sgo{margin-top:34px; width:auto; min-width:220px; display:inline-flex; opacity:0; animation:rise .9s ease-out 1.7s forwards}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes breathe{0%,100%{transform:scale(.9); opacity:.7} 50%{transform:scale(1.08); opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .glow,#splash .sname{animation:none} #splash .slead,#splash .ssub,#splash .sgo{animation:none; opacity:1} #splash{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';
/* =========================================================
   1. 운동 목록
   ========================================================= */
const EX = {
  breath:{n:'4·6 호흡', r:'mind', h:'편히 앉아 코로 4초 들이마시고 입으로 6초 길게 내쉬어요. 어깨 힘을 빼요.'},
  stretch:{n:'목·어깨 스트레칭', r:'stretch', h:'두 팔을 위로 뻗고 머리와 몸을 한쪽으로 기울여요. 당기는 느낌이 드는 곳에서 20초 머문 뒤 반대쪽으로 바꿔요.'},
  yoga:{n:'요가 스트레칭', r:'mind', h:'고양이·소 자세, 아기 자세처럼 숨에 맞춘 느린 동작을 해요. 통증 없는 범위에서만.'},
  chairyoga:{n:'의자 요가', r:'mind', h:'의자에 앉아 한쪽 팔을 머리 위로 뻗어 옆구리를 늘려요. 20초씩 양쪽을 번갈아 해요.'},
  taichi:{n:'태극 동작', r:'mind', h:'무릎을 살짝 굽히고 체중을 좌우로 천천히 옮기며, 두 팔로 구름을 쓸 듯 원을 그려요.'},
  easywalk:{n:'가볍게 걷기', r:'aerobic', h:'편한 속도로 걸어요. 노래를 흥얼거릴 수 있을 정도면 충분해요.'},
  walk:{n:'빠르게 걷기', r:'aerobic', h:'평소보다 조금 빠르게 걸어요. 대화는 되지만 노래는 어려운 정도예요.'},
  indoorwalk:{n:'실내 걷기', r:'aerobic', h:'시원한 실내나 쇼핑몰, 집 안에서 제자리 걷기를 해요.'},
  rhythm:{n:'제자리 걷기 체조', r:'aerobic', h:'네 가지 동작을 30초씩 돌아가며 해요. ① 제자리 걷기 ② 무릎 높이 들기 ③ 옆으로 디디고 모으기 ④ 팔 크게 흔들며 걷기. 대화할 수 있는 정도로 해요.'},
  chairsquat:{n:'의자 스쿼트', r:'strength', h:'의자 앞에 서서 엉덩이가 의자에 닿을 듯 앉았다 일어나요. 10회씩 2세트. 다리 근육과 뼈에 힘을 실어 주는 운동이에요.'},
  kneeext:{n:'앉아서 다리 펴기', r:'strength', h:'의자에 앉아 한쪽 무릎을 천천히 폈다가 내려요. 양쪽을 번갈아 10회씩 2세트.'},
  wallpush:{n:'벽 밀기', r:'strength', h:'벽에서 한 걸음 떨어져 손을 짚고 팔을 굽혔다 펴요. 10회씩 2세트.'},
  heelraise:{n:'뒤꿈치 들기', r:'strength', h:'의자 등받이를 잡고 뒤꿈치를 천천히 올렸다 내려요. 10~15회씩 2세트. 다리뼈에 체중을 실어 주는 운동이에요.'},
  hipabd:{n:'옆으로 다리 들기', r:'strength', h:'손을 허리에 얹거나 의자 등받이를 잡고 서서, 한쪽 다리를 옆으로 천천히 들었다 내려요. 양쪽을 번갈아 10회씩 2세트. 바닥에 옆으로 누워서 해도 좋아요. 엉덩이 옆 근육(중간볼기근)을 키워 넘어짐을 막아요.'},
  slowsit:{n:'천천히 앉기', r:'strength', h:'의자 앞에 서서 3초에 걸쳐 천천히 앉고, 일어날 때는 보통 속도로 일어나요. 10회씩 2세트. 몸무게를 버티며 내려가는 힘을 길러 넘어짐을 막아요.'},
  sidestep:{n:'옆으로 걷기', r:'strength', h:'무릎을 살짝 굽힌 채 옆으로 세 걸음, 다시 반대로 세 걸음 걸어요. 발끝은 앞을 보고 몸은 곧게 세워요.'},
  linedance:{n:'라인댄스 스텝', r:'aerobic', h:'음악에 맞춰 옆으로 한 걸음 디디고 발을 모으는 스텝을 좌우로 반복해요. 팔도 함께 흔들어요.'},
  freesquat:{n:'의자 없이 스쿼트', r:'strength', h:'발을 어깨너비로 벌리고, 엉덩이를 뒤로 빼며 무릎을 굽혔다 일어나요. 무릎이 발끝보다 너무 나가지 않게 해요.'},
  gobletsquat:{n:'덤벨 들고 스쿼트', r:'strength', h:'덤벨(또는 물병)을 가슴 앞에 두 손으로 들고 스쿼트를 해요. 허리는 곧게 세워요.'},
  revlunge:{n:'뒤로 런지', r:'strength', h:'한 발을 뒤로 크게 내디디며 양 무릎을 굽혔다가 돌아와요. 양쪽을 번갈아 해요. 균형이 불안하면 의자를 잡아요.'},
  legpress:{n:'레그 프레스 (머신)', r:'strength', h:'머신에 앉아 발판을 밀어 다리를 폈다가 천천히 돌아와요. 무릎을 끝까지 잠그지 않아요. 가벼운 무게로 시작해요.'},
  tablepush:{n:'식탁 밀기', r:'strength', h:'튼튼한 식탁이나 조리대 가장자리를 잡고 몸을 비스듬히 기울여 팔을 굽혔다 펴요. 벽 밀기보다 조금 더 힘들어요.'},
  kneepushup:{n:'무릎 대고 팔굽혀펴기', r:'strength', h:'바닥에 무릎을 대고 손을 어깨 아래 짚은 채 팔을 굽혔다 펴요. 매트를 깔면 무릎이 편해요.'},
  bandchest:{n:'밴드 가슴 밀기', r:'strength', h:'밴드를 등 뒤 기둥이나 문에 걸고 양손으로 잡아, 가슴 앞에서 앞으로 밀었다 천천히 돌아와요.'},
  chestpress:{n:'체스트 프레스 (머신)', r:'strength', h:'머신에 앉아 손잡이를 앞으로 밀었다 천천히 돌아와요. 가벼운 무게로 시작해요.'},
  bandrow:{n:'밴드 당기기', r:'strength', h:'밴드를 앞쪽 기둥이나 문고리에 걸고 양손으로 잡아, 팔꿈치를 뒤로 당기며 날개뼈를 모아요.'},
  dbrow:{n:'한 팔 덤벨 당기기', r:'strength', h:'한 손으로 의자를 짚고 상체를 숙인 채, 다른 손의 덤벨(물병)을 옆구리 쪽으로 당겼다 내려요. 등은 곧게 펴요.'},
  seatedrow:{n:'시티드 로우 (머신)', r:'strength', h:'머신에 앉아 손잡이를 배 쪽으로 당기며 날개뼈를 모았다가 천천히 돌아와요.'},
  latpull:{n:'랫 풀다운 (머신)', r:'strength', h:'머신에 앉아 위의 손잡이를 가슴 앞으로 당겨 내렸다가 천천히 올려요.'},
  singleheel:{n:'한 발 뒤꿈치 들기', r:'strength', h:'의자 등받이를 잡고 한 발로 서서 뒤꿈치를 천천히 올렸다 내려요. 양쪽을 번갈아 해요.'},
  stepheel:{n:'계단에서 뒤꿈치 들기', r:'strength', h:'계단 끝에 발 앞쪽만 올리고 난간을 잡은 채, 뒤꿈치를 올렸다가 계단보다 살짝 아래로 천천히 내려요.'},
  bandwalk:{n:'밴드 걸고 옆으로 걷기', r:'strength', h:'무릎 위나 발목에 밴드를 걸고 무릎을 살짝 굽힌 채 옆으로 세 걸음씩 걸어요. 엉덩이 옆 근육에 힘이 들어가요.'},
  sidelying:{n:'옆으로 누워 다리 들기', r:'strength', h:'바닥에 옆으로 누워 위쪽 다리를 곧게 편 채 천천히 들었다 내려요. 양쪽을 해요.'},
  wallplank:{n:'벽 플랭크', r:'strength', h:'벽에 팔꿈치나 손을 대고 몸을 비스듬히 곧게 세운 채 20초 버텨요. 배에 살짝 힘을 줘요.'},
  bridge:{n:'엉덩이 들기', r:'strength', h:'바닥에 누워 무릎을 세우고, 엉덩이를 천천히 들었다 내려요. 허리가 아니라 엉덩이 힘으로 들어요.'},

async function initRemote(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  try{
    const [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db||!user) return; const id=await user.id(); if(!id) return;
    const r=db.doc('data/users/'+id+'/second-spring');
    const snap=await Promise.race([r.get(), new Promise((_,j)=>setTimeout(()=>j(new Error('t')),10000))]);
    ref=r;
    const rd=snap.exists?snap.data():null;
    if(rd && (rd.updated||0) >= (S.updated||0)){ S=norm(rd); saveLocal(); render(); }
    else if(S.agreed){ await push(); }
    sync(true);
  }catch(e){ ref=null; }
}

function alloc(ws,total){
  ws=ws.slice(); while(ws.length>1 && total/ws.length<2) ws.pop();
  const sum=ws.reduce((a,b)=>a+b.w,0), raw=ws.map(x=>x.w*total/sum), out=raw.map(Math.floor);
  let left=total-out.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){ out[i]++; left--; } });
  return ws.map((x,i)=>({k:x.k,min:out[i]})).filter(x=>x.min>0);
}

}

    else if(avgSteps>=7000 && type==='active') notes.push('건강 앱 기록을 보면 최근 하루 평균 '+avgSteps.toLocaleString('ko-KR')+'보를 걷고 있어요. 지금처럼 이어 가요.');
  }
  if(bladder && items.some(x=>x.k==='kegel')) notes.push('갱년기 증상 검사에서 소변 문제가 있다고 답해 골반저근 운동을 넣었어요. 꾸준히 하면 요실금을 줄이는 데 도움이 된다는 근거가 있어요. 폐경 여성의 복합운동 뒤 골반저근 활성도가 높아졌다는 국내 연구도 있어요.');
  if(joint) notes.push('관절이 불편한 날이라 무릎에 부담이 적은 동작으로 바꿨어요. 아프면 바로 멈추세요.');
  if(sleepIssue) notes.push('잠이 고르지 않다면 잠들기 2~3시간 전에는 힘든 운동을 피하고, 저녁에는 호흡과 스트레칭 위주로 해요.');
  if(ms && ms.heart>=3) notes.push('두근거림이 심하다고 답하셨어요. 운동 중 가슴이 불편하면 바로 멈추고 진료를 받아 보세요.');

  // 강도가 낮아졌으면 운동 이름과 안내도 맞추기
  if(type==='active' && hi<=2){
    items=items.map(x=>x.k==='walk'?{k:'easywalk',min:x.min}:x);
    notes=notes.filter(n=>!n.startsWith('컨디션이 좋은 날'));
  }
  if(type==='active' && hi<4) notes=notes.filter(n=>!n.startsWith('컨디션이 좋은 날'));
  // 지난번 같은 유형이 너무 힘들었으면 시간 줄이기
  const prev=last(S.logs.filter(l=>l.type===type));
  if(prev && prev.rpe>prev.hi+1 && T>=10 && type!=='recover' && type!=='ease'){
    const t=Math.max(5,Math.round(T*0.8));
    items = type==='calm' ? withWarm([{k:'breath',w:1},{k:spine?'safeyoga':(joint?'chairyoga':'yoga'),w:2},{k:'taichi',w:2}],t) : items;
    if(type==='active'){ const main=items.filter(x=>EX[x.k].r!=='warm').map(x=>({k:x.k,w:x.min})); items=withWarm(main,t); }
    notes.push('지난번 같은 운동이 생각보다 힘드셨어요. 오늘은 '+t+'분으로 줄였어요.');
    T=t;
  }
  const minutes=items.reduce((a,b)=>a+b.min,0);
  const inten = lo===hi ? RPE[hi-1].l : RPE[lo-1].l+'~'+RPE[hi-1].l;
  if(type==='active' && S.habit && habitAct()>=1 && curWeek()<=2) notes.push('평소 운동 습관을 반영해 1~2주 적응 단계를 건너뛰고 시작했어요.');
  if(type==='active' && S.habit){ const fav=(S.habit.kinds||[]).filter(k=>['walk','hike','swim','bike','dance','etc'].includes(k)); if(fav.length){ const nm=fav.map(k=>k==='etc'&&S.habit.other?S.habit.other:HKIND.find(x=>x[0]===k)[1]); notes.push('평소 하는 '+nm.join(', ')+'(으)로 오늘의 유산소 운동을 바꿔서 해도 좋아요. 같은 시간, 같은 강도로 하면 돼요.'); } }
  if(type==='active' && ctx.light && st>=2) notes.push('지금은 가벼운 강도로만 처방하는 중이라 운동 난이도는 1단계로 맞췄어요.');
  const light = ctx.light || effStage(curWeek())===1;
  let tSets = curWeek()<=2 ? 1 : (curWeek()<=5 ? 2 : 3);
  if(habitAct()>=1) tSets=Math.max(tSets,2);
  if(type==='active'){
    let spare=0;
    items=items.map(x=>{ const kd=KIND[x.k]; if(kd!=='reps'&&kd!=='plank') return x; const need=Math.max(2,Math.ceil(tSets*repCycle(x.k)/60)); if(x.min>need){ spare+=x.min-need; return {k:x.k,min:need,sets:tSets}; } return {k:x.k,min:x.min,sets:Math.max(1,Math.min(tSets,Math.floor(x.min*60/repCycle(x.k))))}; });
    if(spare){ const ai=items.findIndex(x=>EX[x.k].r==='aerobic'); if(ai>=0) items[ai]={k:items[ai].k,min:items[ai].min+spare}; else items[0]={k:items[0].k,min:items[0].min+spare}; }
  }
  return {type, light, name:TYPES[type].name, color:TYPES[type].color, why, brain, brain2, brain3, items, minutes, lo, hi, hnotes,
          fitt:{F:freq, I:inten+'\n'+RPE[hi-1].d, T:minutes+'분'+(items.some(x=>x.k==='warmup')?' (준비·마무리 포함)':''), Ty:kindTxt},
          notes, limits};
}

const MUST_RE=/의사|혈압|심장|가슴|멈추|저혈당|숨을 참지|피를 묽게|소견|두근|건강 체크/;
const shortOf=s=>{ const t=String(s).replace(/\s*\([^)]*\d{4}[^)]*\)/g,''); const m=t.match(/^.*?(요|다)[.!?](?=\s|$)/); return m?m[0]:t; };
function rxParts(rx){
  const hn=rx.hnotes||[];
  const must=rx.limits.concat(hn.filter(t=>MUST_RE.test(t)));
  const adj=rx.notes.concat(hn.filter(t=>!MUST_RE.test(t)));
  const brains=[rx.brain,rx.brain2,rx.brain3].filter(Boolean);
  const tips=adj.map(t=>({s:shortOf(t)})).concat(brains.map(b=>({s:b.t, brain:1})));
  return {must, adj, brains, tips};
}

function bindToday(box){
  if(box.querySelector('input[name=equip]')) bindEquip(box,'equip');

  box.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',()=>{ ui.checkForm=a.dataset.go; }));
  const tc=document.getElementById('tcustom');
  if(tc){
    tc.addEventListener('input',()=>{ if(tc.value!=='') box.querySelectorAll('input[name=time]').forEach(r=>r.checked=false); document.getElementById('terr').textContent=''; });
    box.querySelectorAll('input[name=time]').forEach(r=>r.addEventListener('change',()=>{ tc.value=''; document.getElementById('terr').textContent=''; }));
  }
  const sc=document.getElementById('scustom');
  if(sc){
    sc.addEventListener('input',()=>{ if(sc.value!=='') box.querySelectorAll('input[name=sleepH]').forEach(r=>r.checked=false); document.getElementById('serr').textContent=''; });
    box.querySelectorAll('input[name=sleepH]').forEach(r=>r.addEventListener('change',()=>{ sc.value=''; document.getElementById('serr').textContent=''; }));
  }
  const g=document.getElementById('getrx');
  if(g) g.onclick=()=>{
    const f=readForm();
    if(!(f.sleepH>=0 && f.sleepH<=16)){ document.getElementById('serr').textContent='잠잔 시간을 고르거나 0~16시간 사이로 적어 주세요.'; (sc||g).focus(); return; }
    if(!(f.time>=1 && f.time<=180)){ document.getElementById('terr').textContent='운동 시간을 고르거나 1~180분 사이로 적어 주세요.'; (tc||g).focus(); return; }
    S.equip=readEquip(document,'equip'); save();
    ui.sheet=null; ui.form=f; ui.c=f; ui.rx=prescribe(f); ui.nRx=(ui.nRx||0)+1;
    if(!ui.first) ui.first={mood:f.mood, energy:f.energy, anxiety:f.anxiety, fatigue:f.fatigue, type:ui.rx.stop?'stop':ui.rx.type};
    ui.step='rx'; ui.result=null; renderToday(); scrollTop();
  };
  const back=document.getElementById('back'); if(back) back.onclick=()=>{ ui.step='form'; renderToday(); scrollTop(); };
  const did=document.getElementById('didit'); if(did) did.onclick=()=>{ ui.sessMin=null; ui.step='after'; renderToday(); scrollTop(); };
  const ss=document.getElementById('startsess'); if(ss) ss.onclick=()=>startSession();
  const sp=document.getElementById('splitsess'); if(sp) sp.onclick=()=>startSession({split:true});
  const cs=document.getElementById('contsess'); if(cs) cs.onclick=()=>{ const P=S.pending; ui.rx=P.rx; ui.c=P.c; ui.partDone=false; startSession({items:P.rest, part:2, prevMin:P.min1}); };
  const po=document.getElementById('part1only'); if(po) po.onclick=()=>{ const P=S.pending; ui.rx=P.rx; ui.c=P.c; ui.sessMin=P.min1; ui.partDone=false; ui.step='after'; renderToday(); scrollTop(); };
  const rs=document.getElementById('resume'); if(rs) rs.onclick=()=>resumeSession();
  const es=document.getElementById('endsess'); if(es) es.onclick=()=>finishSession();
  box.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>goItem(Number(b.dataset.jump),''));
  mountFigs(box);
  if(ui.step==='rx' && ui.rx && !ui.rx.stop) bindRx(box);
  if(ui.step==='session') bindSession(box);
  const sv=document.getElementById('saveit');
  if(sv) sv.onclick=()=>{
    const rpe=nval('rpe');
    if(!rpe){ document.getElementById('aerr').textContent='운동이 얼마나 힘들었는지 골라 주세요.'; box.querySelector('input[name=rpe]').focus(); return; }

    const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), date:today(), week:curWeek(),
      type:rx.type, ex:rx.items.map(i=>i.k), planned:rx.minutes, lo:rx.lo, hi:rx.hi,
      mood:c.mood, energy:c.energy, anxiety:c.anxiety, fatigue:c.fatigue, sleepQ:c.sleepQ, sleepH:c.sleepH, sym:c.sym,
      moodA:nval('moodA'), fatA:nval('fatA'), rpe, minutes:Math.max(0,Number(document.getElementById('mins').value)||0),
      rxChanges:Math.max(0,(ui.nRx||1)-1)};
    if(rec.rxChanges>0) rec.first=ui.first;

function stepHead(n,title,sub){ return '<div class="page-head"><p class="date">시작 준비 '+n+'/7</p><h1>'+esc(title)+'</h1>'+(sub?'<p class="sub mt">'+esc(sub)+'</p>':'')+'</div>'; }

function questionForm(id, items, opts, cols, answers){
  return items.map((q,i)=>{
    const [t,s]=Array.isArray(q)?q:[q,null];
    return '<fieldset class="item"><legend><em>'+(i+1)+'</em><span>'+esc(t)+(s?'<small>'+esc(s)+'</small>':'')+'</span></legend>'+
      pick(id+i, opts.map((o,v)=>[v,o]), answers[i], cols)+'</fieldset>';
  }).join('');
}
function bindQuestions(box, id, n, answers){
  const bar=box.querySelector('.progress i');
  const upd=()=>{ const done=answers.filter(v=>v!=null).length; if(bar) bar.style.width=(done/n*100)+'%'; };
  for(let i=0;i<n;i++) box.querySelectorAll('input[name="'+id+i+'"]').forEach(r=>r.addEventListener('change',()=>{ answers[i]=Number(r.value); upd(); const it=r.closest('.item'); if(it && it.classList.contains('missing')){ it.classList.remove('missing'); const left=answers.map((v,k)=>v==null?(k+1)+'번':null).filter(Boolean); const err=box.querySelector('#qerr'); if(err) err.textContent= box.querySelector('.item.missing') ? left.join(', ')+' 문항에 아직 답하지 않았어요.' : ''; } }));
  upd();
}
function syncFromDom(box,id,answers){
  for(let i=0;i<answers.length;i++){ const c=box.querySelector('input[name="'+id+i+'"]:checked'); if(c) answers[i]=Number(c.value); }
}
function firstMissing(box,id,answers){
  syncFromDom(box,id,answers);
  const items=box.querySelectorAll('.item');
  const miss=answers.map((v,i)=>v==null?i:-1).filter(i=>i>=0);
  items.forEach((f,i)=>f.classList.toggle('missing',miss.includes(i)));
  const err=box.querySelector('#qerr');
  if(!miss.length){ if(err) err.textContent=''; return false; }
  if(err) err.textContent=miss.map(i=>(i+1)+'번').join(', ')+' 문항에 아직 답하지 않았어요.';
  const f=items[miss[0]]; f.setAttribute('tabindex','-1');
  f.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  try{ f.focus({preventScroll:true}); }catch(e){}
  return true;
}

function parqKeywords(t){
  const m=[['hypertension',/고혈압|혈압이\s*높/],['diabetes',/당뇨|혈당/],['heart',/심장|협심증|심근경색|부정맥|심부전|스텐트/],['osteoporosis',/골다공/],['osteopenia',/골감소/],
    ['knee',/관절염|무릎|고관절|퇴행성/],['back',/허리|디스크|척추|협착/],['asthma',/천식|폐쇄성|copd/i],['thyroid',/갑상선/],['depression',/우울|불안장애|공황/],['surgery',/수술/]];
  return m.filter(x=>x[1].test(t)).map(x=>x[0]);
}

let pdfReady=null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  pdfReady=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'; s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); }catch(e){ rej(e); } }; s.onerror=()=>rej(new Error('pdf')); document.head.appendChild(s); });
  return pdfReady;
}
function canvasBlob(cv){ return new Promise(r=>cv.toBlob(b=>r(b),'image/jpeg',0.85)); }
async function shrink(file){
  const img=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const i=new Image(); i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; i.src=u; });
  const max=1600, r=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*r); cv.height=Math.round(img.naturalHeight*r);
  const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(img,0,0,cv.width,cv.height);
  return canvasBlob(cv);
}
async function pdfPages(file, maxPages){
  const lib=await loadPdfJs();
  const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let n=1;n<=Math.min(doc.numPages,maxPages);n++){
    const pg=await doc.getPage(n), vp0=pg.getViewport({scale:1}), sc=Math.min(2,1600/Math.max(vp0.width,vp0.height)), vp=pg.getViewport({scale:sc});
    const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    out.push(await canvasBlob(cv));
  }
  return out;
}

function cleanResult(r){

async function analyze(box){
  const st=ui.h; st.step='analyzing'; st.prog=''; st.err=''; renderHealth(box); scrollTop();
  const setProg=t=>{ st.prog=t; const e=document.getElementById('hprog'); if(e) e.textContent=t; };
  try{
    let images=[];
    const maxN=Math.min(3, sampleLim.images.maxCount||3);
    for(const f of st.files){
      if(images.length>=maxN) break;
      if(f.type==='application/pdf'){
        setProg('PDF를 읽는 중이에요.');
        try{ images=images.concat(await pdfPages(f, maxN-images.length)); }
        catch(e){ throw {code:'pdf'}; }
      }else{
        if(f.size>sampleLim.images.maxInputBytes){ throw {code:'too_big'}; }
        images.push(await shrink(f).catch(()=>f));
      }
    }
    setProg('기록을 분석하고 있어요. 30초~1분 정도 걸려요.');
    st.ctl=new AbortController();
    const opts={signal:st.ctl.signal, modelTier:'default'};
    if(images.length) opts.images=images.slice(0,maxN);
    const res=await sampleFn.json(analysisPrompt(st.text), opts);
    st.result=cleanResult(res); st.step='review';
  }catch(e){
    const code=e&&e.code;
    st.step='start';
    st.err = code==='pdf' ? 'PDF를 읽지 못했어요. 화면을 캡처하거나 사진으로 찍어서 올려 주세요.'
           : code==='too_big' ? '파일이 너무 커요. 사진을 다시 찍거나 화면을 캡처해서 올려 주세요.'
           : (HERR[code] || '분석하지 못했어요. 다시 시도하거나 직접 골라 주세요.');
  }
  st.ctl=null;
  if(view()==='check' && ui.checkForm==='health'){ renderHealth(document.getElementById('check')); scrollTop(); }
}

function weekChart(logs){
  const W=360,H=220,L=34,R=34,T=16,B=34, cw=(W-L-R)/8;
  const wk=[...Array(8)].map((_,i)=>{ const a=logs.filter(l=>Math.min(8,l.week)===i+1); return {min:a.reduce((x,l)=>x+l.minutes,0), pre:a.length?a.reduce((x,l)=>x+l.mood,0)/a.length:null, post:a.length?a.reduce((x,l)=>x+l.moodA,0)/a.length:null}; });
  const maxMin=Math.max(60,...wk.map(w=>w.min)); const ytop=Math.ceil(maxMin/60)*60;
  const yM=v=>T+(1-v/ytop)*(H-T-B), yD=v=>T+(1-(v-1)/4)*(H-T-B), cx=i=>L+cw*i+cw/2;
  let g='';
  [1,2,3,4,5].forEach(v=>{ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yD(v)+'" y2="'+yD(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(W-R+6)+'" y="'+(yD(v)+4)+'" font-size="11" fill="var(--ink2)">'+v+'</text>'; });
  g+='<text x="'+(L-6)+'" y="'+(yM(ytop)+4)+'" font-size="11" text-anchor="end" fill="var(--ink2)">'+ytop+'분</text><text x="'+(L-6)+'" y="'+(yM(0)+4)+'" font-size="11" text-anchor="end" fill="var(--ink2)">0</text>';
  wk.forEach((w,i)=>{ const bh=yM(0)-yM(w.min); g+='<rect x="'+(cx(i)-cw*0.3)+'" y="'+yM(w.min)+'" width="'+(cw*0.6)+'" height="'+Math.max(0,bh)+'" rx="5" fill="var(--fill)"><title>'+(i+1)+'주차 '+w.min+'분</title></rect><text x="'+cx(i)+'" y="'+(H-12)+'" font-size="12" text-anchor="middle" fill="var(--ink2)">'+(i+1)+'주</text>'; });
  const line=(key,c)=>{ const pts=wk.map((w,i)=>w[key]==null?null:[cx(i),yD(w[key])]); let d='', on=false; pts.forEach(p=>{ if(!p){ on=false; return; } d+=(on?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '; on=true; });
    return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+pts.map((p,i)=>p?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+c+'"><title>'+(i+1)+'주차 '+wk[i][key].toFixed(1)+'</title></circle>':'').join(''); };
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:320px" role="img" aria-label="주차별 운동 시간과 운동 전후 평균 기분">'+g+line('pre','var(--accent)')+line('post','var(--good)')+'</svg>';
}

  '<div class="card"><h2>이렇게 처방해요</h2><p class="sub small">위에서부터 먼저 해당하는 처방을 드려요.</p><div class="scroll mt"><table class="rules"><thead><tr><th>오늘 내 상태</th><th>처방</th><th>강도</th></tr></thead><tbody>'+
    '<tr><td>가슴 답답함·어지러움</td><td><b>운동 쉬기</b>, 진료 권유</td><td>없음</td></tr>'+
    '<tr><td>피로 ‘매우 피곤’, 또는 잠을 못 자고 ‘피곤함’</td><td><b style="color:var(--t-recover)">회복</b><br>호흡, 스트레칭 10분 이내</td><td>아주 가벼움</td></tr>'+
    '<tr><td>기분이나 의욕이 매우 낮음</td><td><b style="color:var(--t-ease)">쉽게 시작</b><br>가벼운 걷기 10분, 스트레칭</td><td>아주 가벼움~가벼움</td></tr>'+
    '<tr><td>불안·긴장 ‘높음’ 이상</td><td><b style="color:var(--t-calm)">마음 이완</b><br>호흡, 요가, 태극 동작</td><td>아주 가벼움~가벼움</td></tr>'+
    '<tr><td>보통이거나 좋음</td><td><b style="color:var(--t-active)">활력</b><br>유산소와 근력운동</td><td>가벼움(1~2주)<br>적당함(3주~)</td></tr>'+
  '</tbody></table></div>'+
  '<p class="small mt">이 밖에 열감이 있으면 실내 운동으로 바꾸고 강도를 한 단계 낮춰요. 관절이 불편하면 무릎에 부담이 적은 동작으로 바꿔요. 건강 체크에서 확인이 필요하거나 마음 검사가 10점 이상이면 가벼운 강도까지만 처방해요.</p><p class="small mt"><b>내 정보</b>를 입력하면 나이와 폐경 시기를 반영해요. 폐경 뒤에는 뼈와 근육을 지키는 근력운동과 체중을 싣는 운동을 넣고, 60세 이상이면 균형 운동을 더하고, 65세 이상이면 강도를 ‘적당함’까지로 맞춰요.</p><p class="small mt"><b>내 건강 기록</b>을 올리면 질환과 약에 맞춰 처방을 조정해요. 예를 들어 고혈압이면 근력운동 중 숨 참지 않기를 안내하고, 골다공증이면 허리를 숙이거나 비트는 동작을 빼고 균형 운동을 넣고, 혈압이 180/110 이상이면 운동 대신 쉬기를 안내해요. 심장 질환, 고혈압, 당뇨병, 최근 수술 기록이 있으면 의사 상담 전까지 가벼운 강도로만 처방해요.</p></div>'+

  '<div class="card"><h2>운동 강도는 말하기로 재요</h2><p class="mt small">이 나이대에는 심박수보다 운동하면서 말이 얼마나 되는지로 강도를 재는 방법(운동자각도, RPE)이 더 쉽고 정확해요.</p><div class="hist mt">'+
    RPE.map((r,i)=>'<div><span><b>'+(i+1)+' '+r.l+'</b><br><span class="sub small">'+r.d+'</span></span><span class="sub small" style="text-align:right">0~10: '+r.cr+'<br>6~20: '+['6~9','10~11','12~13','14~15','16 이상'][i]+'</span></div>').join('')+'</div>'+
    '<p class="small mt">국내 연구를 모은 문헌 고찰은 폐경 여성에게 운동자각도 13~16(6~20 척도, ‘약간 힘듦’ 전후)을 권해요. 그래서 3주차부터 활력 처방은 ‘적당함~약간 힘듦’으로 맞춰요. 대략적인 대응이라 내 몸의 느낌을 기준으로 하세요.</p>'+
    '<p class="ref">Borg G. (1982). Psychophysical bases of perceived exertion. Medicine & Science in Sports & Exercise. (CR10 척도 대응)</p></div>'+

  '<div class="card"><h2>참고한 운동 지침</h2>'+
    '<h3 class="mt">ACSM (미국스포츠의학회)</h3><ul class="tips">'+
      '<li>유산소: 중강도로 일주일에 150분 이상(예: 30분씩 5일). 변화 탭에서 이번 주 운동 시간을 150분 목표와 비교해 보여 줘요.</li>'+
      '<li>근력: 일주일에 2~3일, 큰 근육 운동을 8~12회(처음에는 가볍게 10~15회)씩 해요. 활력 처방에 근력운동이 늘 들어가는 이유예요.</li>'+
      '<li>유연성: 한 자세에서 10~30초 머물러요. 스트레칭 타이머가 20초씩 세는 이유예요.</li>'+
      '<li>균형: 낙상 위험이 있으면 일주일에 2~3일 균형 운동을 해요.</li>'+
      '<li>강도: 0~10 자각도에서 중강도는 5~6이에요. 앱의 ‘적당함’이 여기에 해당해요.</li>'+
      '<li>운동 전 점검: 심장·대사 질환이 있고 운동을 하지 않던 사람은 의사 상담을 권해요. 건강 체크와 건강 기록에 따라 강도를 제한하는 근거예요.</li>'+
    '</ul>'+
    '<h3 class="mt">The Menopause Society (구 북미폐경학회)</h3><ul class="tips">'+
      '<li>열감에는 운동, 요가, 호흡법의 효과 근거가 부족하다고 봐요. 그래서 앱은 운동이 열감을 줄인다고 말하지 않고, 시원한 환경에서 운동하도록만 안내해요.</li>'+
      '<li>대신 운동은 이 시기의 기분, 잠, 뼈, 심장 건강에 도움이 돼요. 뼈 건강에는 체중을 싣는 운동, 근력, 균형 운동이 권장돼요.</li>'+
    '</ul>'+
    '<h3 class="mt">그 밖의 근거</h3><ul class="tips">'+
      '<li>골반저근 운동은 여성의 요실금을 줄이는 데 효과가 있어요(코크런 리뷰). 갱년기 검사에서 소변 문제가 있으면 처방에 넣어요.</li>'+
      '<li>균형 운동과 태극권은 낙상을 줄여요(코크런 리뷰). 골다공증이 있으면 균형 운동을 넣는 이유예요.</li>'+
    '</ul>'+
    '<h3 class="mt">대한폐경학회</h3><p class="small sub">국내 지침은 자료를 확인한 뒤 반영할 예정이에요.</p>'+
    '<p class="ref">American College of Sports Medicine (2021). ACSM’s Guidelines for Exercise Testing and Prescription (11th ed.). / Garber C.E. et al. (2011). Quantity and quality of exercise for developing and maintaining fitness in apparently healthy adults. Med Sci Sports Exerc. / Riebe D. et al. (2015). Updating ACSM’s recommendations for exercise preparticipation health screening. Med Sci Sports Exerc. / The North American Menopause Society (2023). The 2023 nonhormone therapy position statement. Menopause. / Dumoulin C. et al. (2018). Pelvic floor muscle training versus no treatment for urinary incontinence in women. Cochrane Database Syst Rev. / Sherrington C. et al. (2019). Exercise for preventing falls in older people living in the community. Cochrane Database Syst Rev.</p>'+
    '<p class="ref">참고문헌은 원문으로 확인이 필요해요.</p><p class="ref">운동 음악: 사티 「짐노페디 1번」(1888), 파헬벨 「캐논」(17세기), 베토벤 「환희의 송가」(1824), 모차르트 「아이네 클라이네 나흐트무지크」(1787). 저작권이 끝난 곡을 앱이 직접 연주해요. 피아노 소리: Salamander Grand Piano (Alexander Holm, CC BY 3.0).</p></div>'+
  '<h2 style="margin:30px 0 14px">운동이 마음에 닿는 과정</h2>'+
  '<div class="card"><h2>한국 중년 여성 연구에서 확인한 것</h2><p class="small sub">45~55세 여성 91명(폐경 전 51명, 폐경 후 40명)의 신체 조성, 체력, 신체활동과 폐경 증상(MRS), 수면의 질(PSQI), 우울(CES-D)의 관계를 분석한 연구예요.</p><div class="scroll mt"><table class="rules"><thead><tr><th>요인</th><th>결과</th><th>앱에 반영한 것</th></tr></thead><tbody>'+
    '<tr><td>근력(악력)</td><td>폐경 전후 모두 근력이 높을수록 폐경 증상과 우울이 낮은 경향</td><td>활력 처방에 근력운동을 늘 넣어요</td></tr>'+
    '<tr><td>가벼운 신체활동</td><td>폐경 후 여성에서 많을수록 우울이 낮은 경향</td><td>기분이 가라앉은 날 10~15분 가볍게 걷기</td></tr>'+
    '<tr><td>허리둘레, 체지방</td><td>폐경 전 여성에서 증상, 수면 저하, 우울과 관련 (허리둘레와 우울 r=0.63)</td><td>폐경 전에는 허리둘레를 한 달에 한 번 기록</td></tr>'+
    '<tr><td>안정 시 심박수</td><td>폐경 후 여성에서 수면 저하, 우울과 관련</td><td>폐경 후에는 안정 시 심박수를 기록하거나 건강 앱에서 가져와요</td></tr>'+
    '<tr><td>이동을 위한 활동</td><td>폐경 후 여성에서 오히려 증상이 높은 것과 관련</td><td>“나를 위한 시간”인 여가 운동으로 안내해요</td></tr>'+
  '</tbody></table></div>'+
  '<p class="small mt">폐경 증상 검사(MRS)의 판정도 이 연구의 기준(0~4 거의 없음, 5~8 가벼움, 9~16 중간, 17 이상 심함)을 따라요. 연구는 마지막 생리 후 12개월이 지나면 폐경으로 봤어요.</p>'+
  '<p class="small mt"><b>알아 둘 점</b>: 한 시점에 함께 측정한 연구라서 “근력운동을 하면 우울이 줄어든다”는 인과관계까지는 말할 수 없어요. 참여자가 91명으로 적고, 약 80%가 이미 신체활동 권고량을 채운 활동적인 집단이었어요. 그래서 심폐체력이 증상과 관련이 없게 나온 것도 이 집단의 특성 때문일 수 있어, 유산소 운동도 함께 처방해요.</p>'+
  '<p class="ref">'+'최영환 외 (2024). 대한스포츠의학회지, 42(3).'+' 우울은 CES-D(20문항)로 측정했고, 앱은 매주 하기 쉬운 PHQ-9(9문항)를 써요.</p></div>'+
  '<div class="card"><h2>국내 연구 28편이 말하는 운동 전략</h2><p class="small sub">2015~2026년 한국 폐경 여성 대상 운동 연구 28편을 모아 정리한 문헌 고찰이에요. 연구진은 폐경을 “상실의 시기가 아니라 새로운 도약의 시기”로 보자고 말해요. 두 번째 봄이 바라보는 방향이에요.</p><div class="scroll mt"><table class="rules"><thead><tr><th>논문의 제안</th><th>앱에 반영한 것</th></tr></thead><tbody>'+
    '<tr><td>저항운동을 꼭 포함하고, 운동자각도 13~16(약간 힘듦)</td><td>활력 처방에 근력운동을 늘 넣고, 3주차부터 ‘적당함~약간 힘듦’ 강도</td></tr>'+
    '<tr><td>같은 동작만 반복하지 말고 움직임에 다양성을 주기</td><td>지난번과 다른 동작이 나오도록 돌려 가며 처방</td></tr>'+
    '<tr><td>시간이 부족하면 아침·저녁으로 나눠서 하기, 계단 걷기 같은 짧은 운동</td><td>“두 번에 나눠서 할게요” 기능, 두 번 한 운동은 하나로 기록</td></tr>'+
    '<tr><td>낙상 예방을 위한 중간볼기근 기능 운동</td><td>옆으로 다리 들기, 천천히 앉기, 옆으로 걷기 추가. 폐경 후, 골감소증·골다공증, 60세 이상에게 넣어요</td></tr>'+
    '<tr><td>폐경 단계(STRAW+10)마다 다른 몸의 변화</td><td>마지막 생리 시기로 단계를 계산해 시기별 안내</td></tr>'+
  '</tbody></table></div>'+
  '<p class="small mt"><b>운동 시간</b>: 연구들은 주 3회, 한 번에 50~60분 이상, 12주 이상을 썼어요. 앱은 이를 목표로만 안내하고, 내가 낼 수 있는 시간에 맞춰 처방해요.</p>'+
  '<p class="small mt"><b>알아 둘 점</b>: 여러 연구를 모아 설명한 문헌 고찰로, 연구의 질을 체계적으로 평가하지 않았고 대부분 10~20명의 작은 연구예요. 열감이나 유방암을 직접 잰 것이 아니라 염증, 호르몬 같은 중간 지표를 본 결과가 많아서, 앱은 “운동이 열감을 줄인다”거나 “암을 예방한다”고 말하지 않아요.</p>'+
  '<p class="ref">박정호, 소위영, 박은희 (2026). Exercise Interventions for the Physical Management of Menopausal Korean Women: A Narrative Review of Domestic Literature. The Journal of Kinesiology, 28(4), 26-48.</p>'+
  '<p class="ref">폐경 단계: Harlow S.D. et al. (2012). Executive summary of the Stages of Reproductive Aging Workshop + 10. Menopause, 19(4), 387-395. 골밀도 감소 속도: Greendale G.A. et al. (2012). Journal of Bone and Mineral Research, 27(1), 111-118.</p></div>'+
  '<div class="card"><h2>익숙해지면 조금씩 더 어렵게</h2><p class="small mt">근력운동은 몸이 익숙해질수록 부하를 조금씩 늘려야 효과가 이어져요(점진적 과부하, ACSM). 두 번째 봄은 동작마다 3단계를 두고, 운동 뒤 기록한 힘든 정도에 따라 자동으로 단계를 올리고 내려요.</p><div class="hist mt">'+Object.keys(PAT_NAME).map(p=>'<div><span><b>'+PAT_NAME[p]+'</b><br><span class="sub small">'+esc(LADDER[p])+'</span></span></div>').join('')+'</div>'+
  '<p class="small mt">국내 연구들은 대부분 탄력밴드, 덤벨, 머신을 썼어요(박정호 외, 2026). 가지고 있는 도구를 고르면 그 도구로 하는 운동이 처방에 들어가요. 계단이 있으면 계단 오르기, 헬스장 머신이 있으면 실내 자전거도 나와요.</p></div>'+
  '<div class="card"><h2>폐경 단계에 따라 몸이 달라져요</h2><div class="hist mt">'+
    '<div><span><b>폐경 이행기</b><br><span class="sub small">생리 주기가 7일 이상 들쭉날쭉해지는 때부터. 잠, 기분 변화, 열감이 시작돼요.</span></span></div>'+
    '<div><span><b>폐경 초기 (마지막 생리 후 2년)</b><br><span class="sub small">열감이 가장 심하고, 마지막 생리 1년 전부터 2년 뒤까지 뼈가 해마다 약 2%씩 줄어요.</span></span></div>'+
    '<div><span><b>폐경 초기 후반 (2~6년)</b><br><span class="sub small">열감은 줄지만 비뇨생식기 증상이 생기기 시작해요.</span></span></div>'+
    '<div><span><b>폐경 후기 (6년 이후)</b><br><span class="sub small">근육 감소, 관절 불편, 비뇨생식기 증상이 굳어지기 쉬워요.</span></span></div>'+
  '</div><p class="small sub mt">폐경은 마지막 생리 후 12개월 동안 생리가 없는 상태를 말해요. 내 정보에 마지막 생리 시기를 적으면 지금 단계를 알려 드려요.</p></div>'+
  '<div class="card"><h2>체력과 뼈 건강은 따로 봐야 해요</h2><p class="small sub">50~70대 폐경 여성 231명을 골밀도에 따라 정상, 골감소증, 골다공증으로 나눠 비교한 연구예요.</p><ul class="tips">'+
    '<li>나이, 키, 폐활량만 세 집단 사이에 차이가 있었고, <b>악력, 균형, 심폐체력, 안정 시 심박수는 차이가 없었어요.</b> 그래서 앱은 체력 기록만 보고 뼈 상태를 판단하지 않고, 폐경 후 사용자에게 골밀도 검사를 권해요.</li>'+
    '<li>연구진은 운동이 뼈에 좋은 이유를 <b>뼈에 실리는 기계적 자극</b>으로 설명해요. 그래서 걷기, 뒤꿈치 들기, 의자 스쿼트처럼 체중과 힘이 실리는 운동을 넣어요.</li>'+
    '<li>검사 탭에서 골밀도 검사 결과를 적으면 골감소증은 체중을 싣는 운동과 근력운동을 강조하고, 골다공증은 숙이거나 비트는 동작을 빼고 균형 운동을 넣어요.</li>'+
    '<li>참여자의 61%는 운동을 전혀 하지 않았고, 주 3회 이상 운동하는 사람은 8.7%뿐이었어요. 운동을 시작하고 이어 가도록 돕는 도구가 필요한 이유예요.</li></ul>'+
  '<p class="small mt"><b>알아 둘 점</b>: 한 시점에 측정한 연구이고, 골밀도는 허리뼈에서만 쟀어요. 폐활량과 골밀도의 관계는 약해서(r=0.20) 호흡 운동이 뼈를 튼튼하게 한다고 볼 수는 없어요. 또 이 연구의 악력 결과는 골밀도에 관한 것이라, 근력이 폐경 증상·우울과 관련 있다는 위 연구와는 다른 이야기예요.</p>'+
  '<p class="ref">소위영, 최대혁, 윤용진 (2009). 폐경기 여성의 심폐기능, 체력과 골밀도의 관계 분석. 대한스포츠의학회지, 27(2), 165-170.</p></div>'+
  brainCard('근력과 폐경 증상','연구진은 근력과 폐경 증상의 관계를 이렇게 설명해요. 운동 중 나오는 내인성 오피오이드가 체온 조절 중추에 작용해 열감 같은 혈관운동 증상을 줄이고, 근력운동이 에스트라디올을 높여 잠의 질을 돕고, 염증 지표를 낮추고 IGF-1을 늘려 우울을 개선할 수 있다는 거예요.','최영환 외 (2024). 대한스포츠의학회지, 42(3).')+
  brainCard('뇌를 키우는 단백질, BDNF','꾸준한 유산소 운동은 뇌유래신경영양인자(BDNF)를 늘려요. BDNF는 신경세포가 자라고 서로 연결되도록 돕는 단백질로, 우울할 때 낮아지는 경향이 있어요. 중년 여성 103명을 조사한 연구에서 심폐체력이 좋을수록 BDNF가 높았고, 16주 운동 뒤 BDNF가 늘었어요.','조현철 (2010). 중년여성의 운동형태가 뇌건강 인자(BDNF, NGF)와 건강체력에 미치는 영향. 한국연구재단 결과보고서.')+
  brainCard('기분을 조절하는 신경전달물질','운동은 세로토닌, 도파민처럼 기분과 의욕에 관여하는 뇌의 신경전달 체계에 영향을 줘요. 운동 직후 기분이 좋아지는 데에는 엔도르핀과 엔도카나비노이드 같은 물질도 관여한다고 알려져 있어요.',null)+
  brainCard('에스트로겐이 줄면 마음도 흔들려요','폐경 전후에는 에스트로겐이 줄면서 세로토닌 같은 기분 조절 체계도 영향을 받아요. 그래서 이 시기에는 우울을 겪을 위험이 높아진다고 알려져 있어요. 운동은 약 없이 스스로 할 수 있는 기분 관리 방법 중 하나예요.','Bromberger et al. (2011). Major depression during and after the menopausal transition: SWAN. Psychological Medicine.')+
  brainCard('느린 호흡과 자율신경','천천히 길게 내쉬는 호흡은 몸을 쉬게 하는 부교감신경을 활성화해서 심박수를 낮추고 긴장을 풀어 줘요. 불안한 날 ‘마음 이완’ 처방에 호흡을 넣은 이유예요.',null)+
  brainCard('재미있게 할 때 더 효과가 있어요','중년 여성 70명이 8주 동안 집에서 저강도 운동을 했을 때, 재미 요소가 있었던 집단은 우울 점수가 5.48점에서 2.48점으로 낮아졌어요. 같은 운동을 재미 요소 없이 한 집단은 대조 집단과 뚜렷한 차이가 없었어요.','서은영 (2021). 과체중 중년여성의 체질량지수, 우울, 운동재미, 운동몰입에 미치는 가상현실 운동 프로그램 효과. 을지대학교 박사학위논문.')+

const VOL={low:.32, mid:.55, high:.85};
const PIANO={buf:{}, ready:false, loading:null};
const sampleMidi=n=>{ const m=n.match(/^([A-G])(s?)(\d)$/); return 12*(Number(m[3])+1)+NOTE[m[1]]+(m[2]?1:0); };
function loadPiano(){
  if(PIANO.loading||!M.ctx) return PIANO.loading;
  PIANO.loading=Promise.all(Object.keys(PIANO_B64).map(n=>{
    const bin=atob(PIANO_B64[n]), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new Promise(res=>{ try{ M.ctx.decodeAudioData(u.buffer, b=>{ PIANO.buf[sampleMidi(n.replace('s','s'))]=b; res(); }, ()=>res()); }catch(e){ res(); } });
  })).then(()=>{ PIANO.ready=Object.keys(PIANO.buf).length>0; });
  return PIANO.loading;
}
function makeReverb(c){
  const len=Math.floor(c.sampleRate*2.6), ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  const cv=c.createConvolver(); cv.buffer=ir; return cv;
}
const M={ctx:null, master:null, piece:null, ev:null, len:0, t0:0, i:0, loop:0, timer:null, on:false, duck:0};
function buildEvents(pc){
  const spb=60/pc.bpm, ev=[]; let t=0;
  pc.mel.forEach(([n,b])=>{ if(n) ev.push({t:t*spb, m:mi(n), d:b*spb*0.98, v:.5+Math.random()*.06}); t+=b; });
  let ta=0; pc.acc.forEach(([ns,b])=>{ ns.forEach((n,j)=>ev.push({t:ta*spb+j*.018, m:mi(n), d:b*spb*1.05, v:(mi(n)<48?.3:.17)+Math.random()*.03})); ta+=b; });
  ev.sort((a,b)=>a.t-b.t); return {ev, len:Math.max(t,ta)*spb};
}
function musicVol(){ return VOL[SET().musicVol||'mid']||VOL.mid; }
function ensureCtx(){
  if(M.ctx) return M.ctx;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  M.ctx=new AC(); const c=M.ctx, comp=c.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=3;
  M.master=c.createGain(); M.master.gain.value=0;
  const dry=c.createGain(); dry.gain.value=.8; const wet=c.createGain(); wet.gain.value=.32; const rv=makeReverb(c);
  M.master.connect(dry); M.master.connect(rv); rv.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(c.destination);
  loadPiano();
  return M.ctx;
}
function playNote(m,time,dur,vel){
  const c=M.ctx;
  if(PIANO.ready){
    let best=null; Object.keys(PIANO.buf).forEach(k=>{ k=Number(k); if(best===null||Math.abs(k-m)<Math.abs(best-m)) best=k; });
    const src=c.createBufferSource(), g=c.createGain(); src.buffer=PIANO.buf[best]; src.playbackRate.value=Math.pow(2,(m-best)/12);
    src.connect(g); g.connect(M.master);
    const end=time+dur+.45;
    g.gain.setValueAtTime(vel,time); g.gain.setValueAtTime(vel,end); g.gain.exponentialRampToValueAtTime(.0001,end+.9);
    src.start(time); src.stop(end+1);
    return;
  }
  const f=440*Math.pow(2,(m-69)/12);
  const o1=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), g2=c.createGain();
  o1.type='triangle'; o1.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=.18;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(M.master);
  g.gain.setValueAtTime(0.0001,time); g.gain.linearRampToValueAtTime(vel,time+.015);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,vel*.3),time+Math.min(dur,1.4));
  g.gain.exponentialRampToValueAtTime(.0001,time+dur+.6);
  o1.start(time); o2.start(time); o1.stop(time+dur+.7); o2.stop(time+dur+.7);
}
function schedule(){
  if(!M.on||!M.ev) return; const c=M.ctx;
  while(true){
    if(M.i>=M.ev.length){ M.i=0; M.loop++; }
    const e=M.ev[M.i], at=M.t0+M.loop*M.len+e.t;
    if(at>c.currentTime+.3) break;
    if(at>=c.currentTime-.05) playNote(e.m,at,e.d,e.v);
    M.i++;
  }
}
function setGain(v,ramp){ if(!M.master) return; const t=M.ctx.currentTime; M.master.gain.cancelScheduledValues(t); M.master.gain.setValueAtTime(M.master.gain.value,t); M.master.gain.linearRampToValueAtTime(v,t+(ramp||.4)); }
function musicPlay(key){
  if(!SET().musicOn) return; const c=ensureCtx(); if(!c) return;

function say(text, force){

function tick(){
  const s=ui.sess; if(!s) return;

  const it=s.items[s.i], dur=it.min*60, t=s.el/1000, tt=s.tau/1000, sp=s.speed||1;

  if(bySets && (tt>=work || t>=dur*3)) return nextItem(false);

  const isAero=kd_==='aero';
  const ct = isAero? t : tt, cdur = isAero? dur : (bySets? work : dur/sp);

/* =========================================================
   건강 앱 데이터 가져오기 (애플 건강, 삼성 헬스)
   파일은 이 기기 안에서만 읽고, 날짜별 걸음 수와 수면 시간만 저장해요.
   ========================================================= */
const EXT_DAYS=90;
let zipReady=null;
function loadZip(){
  if(zipReady) return zipReady;
  zipReady=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=()=>res(window.JSZip); s.onerror=()=>{ zipReady=null; rej(new Error('zip')); }; document.head.appendChild(s); });
  return zipReady;
}
const dayStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const cutoffStr=()=>{ const d=new Date(); d.setDate(d.getDate()-EXT_DAYS); return dayStr(d); };

/* --- 애플: export.xml을 조금씩 읽으며 걸음·수면 기록만 골라요 --- */
function appleParser(){
  const cut=cutoffStr(), steps={}, asleep={}, inbed={}, rhr={}; let buf='', n=0;
  const attr=(tag,a)=>{ const m=tag.match(new RegExp(' '+a+'="([^"]*)"')); return m?m[1]:''; };
  const add=(o,day,src,v)=>{ (o[day]=o[day]||{}); o[day][src]=(o[day][src]||0)+v; };
  const mins=(a,b)=>{ const p=s=>new Date(s.replace(' ','T').replace(/ ([+-]\d\d)(\d\d)$/,'$1:$2')).getTime(); return (p(b)-p(a))/60000; };
  function handle(tag){
    const type=attr(tag,'type');
    if(type==='HKQuantityTypeIdentifierRestingHeartRate'){
      const sd=attr(tag,'startDate'); if(sd.slice(0,10)<cut) return; const v=Number(attr(tag,'value')); if(v>30&&v<150){ const d=sd.slice(0,10); (rhr[d]=rhr[d]||[]).push(v); n++; }
    }else if(type==='HKQuantityTypeIdentifierStepCount'){
      const sd=attr(tag,'startDate'); if(sd.slice(0,10)<cut) return;
      add(steps, sd.slice(0,10), attr(tag,'sourceName'), Number(attr(tag,'value'))||0); n++;
    }else if(type==='HKCategoryTypeIdentifierSleepAnalysis'){
      const sd=attr(tag,'startDate'), ed=attr(tag,'endDate'); if(ed.slice(0,10)<cut) return;
      const v=attr(tag,'value'), m=mins(sd,ed); if(!(m>0 && m<24*60)) return;
      if(/Asleep/.test(v)) add(asleep, ed.slice(0,10), attr(tag,'sourceName'), m); else if(/InBed/.test(v)) add(inbed, ed.slice(0,10), attr(tag,'sourceName'), m);
      n++;
    }
  }
  return {
    push(text){ buf+=text; const last=buf.lastIndexOf('>'); if(last<0) return; const part=buf.slice(0,last+1); buf=buf.slice(last+1);
      const re=/<Record\b[^>]*>/g; let m; while((m=re.exec(part))){ if(m[0].indexOf('StepCount')>0||m[0].indexOf('SleepAnalysis')>0||m[0].indexOf('RestingHeartRate')>0) handle(m[0]); } },
    result(){
      const days={}; const mx=o=>Math.max(...Object.values(o));
      Object.keys(steps).forEach(d=>{ (days[d]=days[d]||{}).steps=Math.round(mx(steps[d])); });
      Object.keys(inbed).concat(Object.keys(asleep)).forEach(d=>{ const v=asleep[d]?mx(asleep[d]):mx(inbed[d]); if(v>0) (days[d]=days[d]||{}).sleepH=Math.round(Math.min(16,v/60)*10)/10; });
      Object.keys(rhr).forEach(d=>{ const a=rhr[d]; (days[d]=days[d]||{}).rhr=Math.round(a.reduce((x,y)=>x+y,0)/a.length); });
      return {days, count:n};
    }
  };
}
async function readAppleFile(file, prog){
  const P=appleParser(); const dec=new TextDecoder();
  if(/\.zip$/i.test(file.name) || file.type==='application/zip'){
    const JSZip=await loadZip(); const zip=await JSZip.loadAsync(file);
    const entry=Object.values(zip.files).find(f=>!f.dir && /\.xml$/i.test(f.name) && !/cda/i.test(f.name) && !/__MACOSX/.test(f.name));
    if(!entry) throw {code:'noxml'};
    await new Promise((res,rej)=>{ let got=0; entry.internalStream('uint8array').on('data',ch=>{ got+=ch.length; P.push(dec.decode(ch,{stream:true})); if(got%(8<<20)<ch.length) prog('읽는 중이에요… '+Math.round(got/1048576)+'MB'); }).on('error',rej).on('end',res).resume(); });
  }else{
    if(file.stream){ const r=file.stream().getReader(); let got=0; for(;;){ const {done,value}=await r.read(); if(done) break; got+=value.length; P.push(dec.decode(value,{stream:true})); if(got%(8<<20)<value.length) prog('읽는 중이에요… '+Math.round(got/1048576)+'MB'); } }
    else P.push(await file.text());
  }
  return P.result();
}

/* --- 삼성 헬스: 내보낸 CSV에서 걸음·수면 파일을 찾아 읽어요 --- */
function csvRows(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) return null;
  let hi=0; if(/^com\.samsung/i.test(lines[0]) && lines.length>2) hi=1;
  const split=l=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"'){ q=!q; continue; } if(ch===','&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out; };
  const head=split(lines[hi]).map(x=>x.trim().toLowerCase());
  return {col:name=>head.findIndex(x=>x===name||x.endsWith('.'+name)), rows:lines.slice(hi+1).map(split)};
}
function samsungFromText(name, text, acc){
  const lower=name.toLowerCase(), cut=cutoffStr(); const t=csvRows(text); if(!t) return;
  if(/pedometer_day_summary|step_daily_trend/.test(lower)){
    const di=t.col('day_time'), si=Math.max(t.col('step_count'), t.col('count'));
    if(di<0||si<0) return;
    t.rows.forEach(r=>{ const ms=Number(r[di]), v=Number(r[si]); if(!ms||!(v>=0)) return; const d=new Date(ms);
      const day = ms%86400000===0 ? d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0') : dayStr(d);
      if(day<cut) return; acc.steps[day]=Math.max(acc.steps[day]||0, v); acc.n++; });
  }else if(/com\.samsung\.(shealth|health)\.sleep\.\d|com\.samsung\.health\.sleep\.csv|\.sleep\.\d{8}/.test(lower) && !/stage|combined|data|goal|snoring/.test(lower)){
    const si=t.col('start_time'), ei=t.col('end_time'), oi=t.col('time_offset'); if(si<0||ei<0) return;
    t.rows.forEach(r=>{ const p=s=>{ const x=String(s||'').trim(); if(/^\d{12,}$/.test(x)) return Number(x); return new Date(x.replace(' ','T')+'Z').getTime(); };
      const a=p(r[si]), b=p(r[ei]); if(!(b>a) || b-a>16*3600000) return;
      let off=0; const om=String(r[oi]||'').match(/UTC([+-])(\d\d)(\d\d)/); if(om) off=(om[1]==='-'?-1:1)*(Number(om[2])*60+Number(om[3]))*60000; else off=-new Date().getTimezoneOffset()*60000;
      const e=new Date(b+off); const day=e.getUTCFullYear()+'-'+String(e.getUTCMonth()+1).padStart(2,'0')+'-'+String(e.getUTCDate()).padStart(2,'0');
      if(day<cut) return; acc.sleep[day]=(acc.sleep[day]||0)+(b-a)/3600000; acc.n++; });
  }
}
async function readSamsungFiles(files, prog){
  const acc={steps:{}, sleep:{}, n:0};
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      const JSZip=await loadZip(); const zip=await JSZip.loadAsync(f);
      for(const e of Object.values(zip.files)){ if(e.dir||!/\.csv$/i.test(e.name)) continue; const nm=e.name.split('/').pop(); if(!/pedometer_day_summary|step_daily_trend|sleep/i.test(nm)) continue; prog(nm+' 읽는 중이에요…'); samsungFromText(nm, await e.async('string'), acc); }
    }else if(/\.csv$/i.test(f.name)){ prog(f.name+' 읽는 중이에요…'); samsungFromText(f.name, await f.text(), acc); }
  }
  const days={}; Object.keys(acc.steps).forEach(d=>{ (days[d]=days[d]||{}).steps=Math.round(acc.steps[d]); });
  Object.keys(acc.sleep).forEach(d=>{ (days[d]=days[d]||{}).sleepH=Math.round(Math.min(16,acc.sleep[d])*10)/10; });
  return {days, count:acc.n};
}
function extSave(src, r){
  const prev=(S.ext&&S.ext.days)||{}, days=Object.assign({}, prev);
  Object.keys(r.days).forEach(d=>{ days[d]=Object.assign({}, days[d]||{}, r.days[d]); });
  const cut=cutoffStr(); Object.keys(days).forEach(d=>{ if(d<cut) delete days[d]; });
  S.ext={source:src, date:today(), days}; save();
}
const extDay=d=>S.ext&&S.ext.days&&S.ext.days[d]||null;
function extAvgSteps(n){ if(!S.ext) return null; const v=[]; for(let i=1;i<=n;i++){ const d=new Date(); d.setDate(d.getDate()-i); const x=extDay(dayStr(d)); if(x&&x.steps!=null) v.push(x.steps); } return v.length>=3 ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; }
function extAvgRhr(n){ if(!S.ext) return null; const v=[]; for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-i); const x=extDay(dayStr(d)); if(x&&x.rhr) v.push(x.rhr); } return v.length>=2 ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; }
function extSummary(){
  if(!S.ext) return null; const ds=Object.keys(S.ext.days).sort();
  const st=ds.filter(d=>S.ext.days[d].steps!=null).length, sl=ds.filter(d=>S.ext.days[d].sleepH!=null).length;
  return {from:ds[0], to:ds[ds.length-1], st, sl};
}

function bindExt(box, after){
  const run=async(src, files)=>{
    const msg=box.querySelector('#exterr'); const prog=t=>{ msg.style.color='var(--ink2)'; msg.textContent=t; };
    if(!files.length) return; prog('파일을 읽고 있어요. 크기에 따라 1분 정도 걸릴 수 있어요.');
    try{
      const r= src==='apple' ? await readAppleFile(files[0], prog) : await readSamsungFiles(files, prog);
      const nd=Object.keys(r.days).length;
      if(!nd){ msg.style.color='var(--warn)'; msg.textContent= src==='apple' ? '최근 '+EXT_DAYS+'일 동안의 걸음 수나 수면 기록을 찾지 못했어요. 건강 앱에서 내보낸 파일이 맞는지 확인해 주세요.' : '걸음 수나 수면 기록을 찾지 못했어요. 이름에 pedometer_day_summary나 sleep이 들어간 CSV 파일을 골라 주세요.'; return; }
      extSave(src, r);
      if(after) return after(nd);
      renderSettings();
      const m=box.querySelector('#exterr'); if(m){ m.style.color='var(--good)'; m.textContent='최근 '+nd+'일치 기록을 가져왔어요. 오늘의 잠잔 시간과 운동 처방에 반영해요.'; }
    }catch(e){ msg.style.color='var(--warn)'; msg.textContent = e&&e.code==='noxml' ? '압축 파일 안에서 건강 기록(xml)을 찾지 못했어요.' : '파일을 읽지 못했어요. 파일이 너무 크면 압축을 풀고 xml 파일만 골라 주세요.'; }
  };
  const a=box.querySelector('#extapple'); if(a) a.onchange=()=>{ run('apple',[...a.files]); a.value=''; };
  const s=box.querySelector('#extsam'); if(s) s.onchange=()=>{ run('samsung',[...s.files]); s.value=''; };
}

function extChart(){
  if(!S.ext) return '';
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dayStr(d); days.push([k, extDay(k)||{}]); }
  if(!days.some(x=>x[1].steps!=null||x[1].sleepH!=null)) return '';
  const W=360,H=200,L=40,R=30,T=14,B=30, cw=(W-L-R)/14;
  const maxS=Math.max(6000,...days.map(x=>x[1].steps||0)), top=Math.ceil(maxS/2000)*2000;
  const yS=v=>T+(1-v/top)*(H-T-B), yH=v=>T+(1-Math.min(12,v)/12)*(H-T-B), cx=i=>L+cw*i+cw/2;
  let g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yS(0)+'" y2="'+yS(0)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yS(top)+4)+'" font-size="11" text-anchor="end" fill="var(--ink2)">'+(top/1000)+'천</text><text x="'+(W-R+6)+'" y="'+(yH(12)+4)+'" font-size="11" fill="var(--ink2)">12시간</text><text x="'+(W-R+6)+'" y="'+(yH(0)+4)+'" font-size="11" fill="var(--ink2)">0</text>';
  days.forEach(([k,v],i)=>{ if(v.steps!=null) g+='<rect x="'+(cx(i)-cw*.32)+'" y="'+yS(v.steps)+'" width="'+(cw*.64)+'" height="'+(yS(0)-yS(v.steps))+'" rx="3" fill="var(--action)"><title>'+md(k)+' '+v.steps+'보</title></rect>'; if(i%3===1) g+='<text x="'+cx(i)+'" y="'+(H-10)+'" font-size="11" text-anchor="middle" fill="var(--ink2)">'+Number(k.slice(5,7))+'/'+Number(k.slice(8))+'</text>'; });
  let d='', on=false; days.forEach(([k,v],i)=>{ if(v.sleepH==null){ on=false; return; } d+=(on?'L':'M')+cx(i).toFixed(1)+' '+yH(v.sleepH).toFixed(1)+' '; on=true; });
  g+='<path d="'+d+'" fill="none" stroke="var(--t-recover)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+days.map(([k,v],i)=>v.sleepH!=null?'<circle cx="'+cx(i)+'" cy="'+yH(v.sleepH)+'" r="4" fill="var(--t-recover)"><title>'+md(k)+' '+v.sleepH+'시간</title></circle>':'').join('');
  const avg=extAvgSteps(7);
  return '<div class="card"><h2>걸음 수와 수면</h2><p class="sub small">'+(S.ext.source==='apple'?'아이폰 건강 앱':'삼성 헬스')+'에서 가져온 최근 14일 기록이에요.'+(avg!=null?' 최근 7일 하루 평균 '+avg.toLocaleString('ko-KR')+'보.':'')+'</p><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:320px" role="img" aria-label="최근 14일 걸음 수와 수면 시간">'+g+'</svg></div><div class="legend"><span style="--c:var(--action)">걸음 수</span><span style="--c:var(--t-recover)">수면 시간</span></div></div>';
}

  else if(bpLevel()===1) L.push('기록된 혈압이 높은 편이에요. 가벼운 강도로만 운동하세요.');
  if(hHas('hypertension')||mHas('bpmed')||mHas('betablocker')||mHas('diuretic')) L.push('혈압: 근력운동 중 숨을 참지 말고, 운동이 끝나면 마무리 운동으로 천천히 끝내세요. 앉았다 일어날 때는 천천히 일어나요.');
  if(hHas('diabetes')||mHas('insulin')) L.push('당뇨: 식사 후 1~2시간 사이에 운동하고, 사탕 같은 간식을 챙기세요. 식은땀, 손 떨림이 있으면 멈추고 당을 보충하세요.');

  if(hHas('asthma')) L.push('천식: 준비 운동을 충분히 하고, 흡입기를 가까이 두세요.');
  if(mHas('diuretic')) L.push('이뇨제: 운동 전후와 중간에 물을 조금씩 자주 마시세요.');
  if(mHas('statin')) L.push('고지혈증약: 이유 없는 근육통이 심하거나 오래가면 의사에게 알려 주세요.');
  if(mHas('anticoagulant')) L.push('피를 묽게 하는 약: 넘어지거나 부딪히지 않게 주의하세요.');
  (S.health&&S.health.notes||[]).forEach(n=>L.push('의사 소견: '+n));
  return L;
